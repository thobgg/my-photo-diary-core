            const statusEl = ov.querySelector('#alb-users-status');

            const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
            const onKey = (e) => {
                if (e.key !== 'Escape') return;
                const active = document.activeElement;
                // ESC in einem dirty Feld revertiert nur die Zeile (damit man nicht
                // aus Versehen tippt und den Wert verliert). Zweites ESC schließt.
                if (active && (active.classList?.contains('alb-users-row-display')
                            || active.classList?.contains('alb-users-role-select'))) {
                    const row = active.closest('.alb-users-row');
                    if (row && row.classList.contains('is-dirty')) {
                        revertRow(row);
                        e.preventDefault();
                        return;
                    }
                    active.blur();
                    e.preventDefault();
                    return;
                }
                e.preventDefault();
                close();
            };
            ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
            btnClose.addEventListener('click', close);
            btnDone.addEventListener('click', close);
            document.addEventListener('keydown', onKey);

            function rowDirty(row) {
                const inp = row.querySelector('.alb-users-row-display');
                const sel = row.querySelector('.alb-users-role-select');
                const nameDirty = inp.value.trim() !== (inp.dataset.original || '');
                const roleDirty = sel && !sel.disabled
                    ? sel.value !== (sel.dataset.original || '')
                    : false;
                return nameDirty || roleDirty;
            }

            function refreshRowDirty(row) {
                const dirty = rowDirty(row);
                row.classList.toggle('is-dirty', dirty);
                const btn = row.querySelector('.alb-users-commit');
                if (btn) btn.disabled = !dirty;
            }

            function revertRow(row) {
                const inp = row.querySelector('.alb-users-row-display');
                const sel = row.querySelector('.alb-users-role-select');
                inp.value = inp.dataset.original || '';
                if (sel) sel.value = sel.dataset.original || '';
                row.classList.remove('is-dirty');
                const btn = row.querySelector('.alb-users-commit');
                if (btn) btn.disabled = true;
            }

            async function saveRow(row) {
                if (!rowDirty(row)) return;
                const inp = row.querySelector('.alb-users-row-display');
                const sel = row.querySelector('.alb-users-role-select');
                const btn = row.querySelector('.alb-users-commit');
                const username = row.dataset.username;

                const payload = {};
                if (inp.value.trim() !== (inp.dataset.original || '')) {
                    payload.display_name = inp.value.trim();
                }
                if (sel && !sel.disabled && sel.value !== (sel.dataset.original || '')) {
                    payload.role = sel.value;
                }
                if (!Object.keys(payload).length) return;

                inp.disabled = true;
                if (sel) sel.disabled = true;
                if (btn) btn.disabled = true;
                statusEl.textContent = _t('users_admin.status_saving', null, 'Speichere…');
                try {
                    const r = await fetch(`${API_BASE}/api/admin/users/${encodeURIComponent(username)}`, {
                        method : 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body   : JSON.stringify(payload),
                    });
                    const d = await r.json();
                    if (!r.ok) throw new Error(d.detail || r.statusText);
                    inp.dataset.original = d.display_name || '';
                    inp.value = d.display_name || '';
                    if (sel) {
                        sel.dataset.original = d.role || '';
                        sel.value = d.role || '';
                    }
                    row.classList.remove('is-dirty');
                    row.classList.add('saved');
                    statusEl.textContent = '';
                    const bits = [];
                    if ('display_name' in payload) {
                        bits.push(payload.display_name
                            ? _t('users_admin.toast_display_set', { name: payload.display_name }, `Vorname: ${payload.display_name}`)
                            : _t('users_admin.toast_display_cleared', null, 'Vorname gelöscht'));
                    }
                    if ('role' in payload) bits.push(_t('users_admin.toast_role_set', { role: payload.role }, `Rolle: ${payload.role}`));
                    if (typeof window.mpdToast === 'function' && bits.length) {
                        window.mpdToast(`${username} — ${bits.join(', ')}`, { duration: 1800 });
                    }
                    setTimeout(() => row.classList.remove('saved'), 900);
                } catch (err) {
                    statusEl.textContent = _t('users_admin.error_prefix', { msg: (err.message || err) }, `Fehler: ${err.message || err}`);
                } finally {
                    inp.disabled = false;
                    if (sel) sel.disabled = sel.dataset.selfLock === '1';
                    if (btn) btn.disabled = !row.classList.contains('is-dirty');
                }
            }

                        const d = await r.json().catch(() => ({}));
                        throw new Error(d.detail || r.statusText);
                    }
                    const data = await r.json();
                    const users    = data.users || [];
                    const selfUser = data.self || '';

                    if (!users.length) {

                    head.innerHTML = `<div>${_t('users_admin.head_user', null, 'User')}</div><div>${_t('users_admin.head_role', null, 'Rolle')}</div><div>${_t('users_admin.head_display', null, 'Vorname')}</div><div></div>`;
                    frag.appendChild(head);

                    const roleOptions = ['admin', 'editor', 'viewer'];

                    users.forEach(u => {
                        const row = document.createElement('div');
                        row.className = 'alb-users-row';
                        row.dataset.username = u.username;
                        const display  = u.display_name || '';

                        const lastAdmin = u.role === 'admin' && adminCount <= 1;
                        const delLocked = isSelf || lastAdmin;
                        const delTitle = isSelf
                            ? _t('users_admin.del_self', null, 'Eigener User kann nicht gelöscht werden.')
                            : (lastAdmin ? _t('users_admin.del_last_admin', null, 'Letzter Admin — kann nicht gelöscht werden.')
                                         : _t('users_admin.del_user_title', { user: u.username }, `${u.username} löschen`));
                        const selectTitle = isSelf
                            ? _t('users_admin.role_self', null, 'Eigene Rolle kann nicht geändert werden.')
                            : (lastAdmin ? _t('users_admin.role_last_admin', null, 'Letzter Admin — Rolle kann nicht geändert werden.')
                                         : _t('users_admin.role_for_user', null, 'Rolle für diesen User'));
                        const selectLocked = isSelf || lastAdmin;

            const introRaw = _t('users_admin.del_intro', { user: '__U__' }, `Der Login wird entfernt und alle aktiven Sessions von __U__ werden ungültig. Der Personal-Ordner auf der Festplatte bleibt unangetastet — nur MPD verliert den Schlüssel dazu.`);
            const introHtml = introRaw.replace('__U__', `<strong>${escapeHtml(username)}</strong>`);

                <div class="alb-mail-box" role="alertdialog" aria-modal="true">
                    <div class="alb-mail-header">
                        <h3>${_t('users_admin.del_title', { user: escapeHtml(username) }, `User „${escapeHtml(username)}" löschen?`)}</h3>

                            <button type="button" class="alb-mail-send" style="background:#c94c4c;">${_t('users_admin.del_btn_delete', null, 'Löschen')}</button>
                        </div>
                    </div>
                </div>`;
            document.body.appendChild(ov);

            const elStatus = ov.querySelector('#del-status');
            const btnCnc   = ov.querySelector('.alb-mail-cancel');
            const btnGo    = ov.querySelector('.alb-mail-send');
            const btnClose = ov.querySelector('.alb-mail-close');

            const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
            const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(); } };
            ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
            btnCnc.addEventListener('click', close);
            btnClose.addEventListener('click', close);
            document.addEventListener('keydown', onKey);
            setTimeout(() => btnGo.focus(), 30);

            btnGo.addEventListener('click', async () => {
                btnGo.disabled = true; btnCnc.disabled = true;
                elStatus.textContent = _t('users_admin.del_status_deleting', null, 'Lösche…');
                try {
                    const r = await fetch(`${API_BASE}/api/admin/users/${encodeURIComponent(username)}`, {
                        method: 'DELETE',
                    });
                    const d = await r.json();
                    if (!r.ok) throw new Error(d.detail || r.statusText);
                    if (typeof window.mpdToast === 'function') {
                        let sk = '';
                        if (d.sessions_killed) {
                            const skKey = d.sessions_killed === 1 ? 'users_admin.del_toast_sessions_one' : 'users_admin.del_toast_sessions_many';
                            sk = _t(skKey, { count: d.sessions_killed }, ` · ${d.sessions_killed} Session${d.sessions_killed === 1 ? '' : 's'} invalidiert`);
                        }
                        window.mpdToast(_t('users_admin.del_toast_deleted', { user: username, sessions: sk }, `User „${username}" gelöscht${sk}`), { duration: 2200 });
                    }
                    close();
                    if (typeof onDone === 'function') onDone();
                } catch (err) {
                    elStatus.textContent = _t('users_admin.error_prefix', { msg: (err.message || err) }, `Fehler: ${err.message || err}`);
                    btnGo.disabled = false; btnCnc.disabled = false;
                }
            });
        }

        // ── Album löschen — Type-to-confirm + Undo-Toast ─────────────────
        function _openDeleteConfirmModal(album) {
            return new Promise(resolve => {
                const titleToMatch = album.title || album.name;
                const _t = (k, vars, fb) => (window.MPD_I18N ? window.MPD_I18N.t(k, vars) : fb) || fb;
                const ov = document.createElement('div');
                ov.className = 'alb-delete-overlay';
                ov.innerHTML = `
                    <div class="alb-delete-box" role="alertdialog" aria-modal="true">
                        <div class="alb-delete-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></div>
                        <h3>${_t('album_delete.title', { album: escapeHtml(titleToMatch) }, `Album „${escapeHtml(titleToMatch)}" löschen?`)}</h3>
                        <div class="alb-delete-body">
                            <strong>${_t('album_delete.what_happens', null, 'Was passiert:')}</strong>
                            <ul>
                                <li>${_t('album_delete.bullet_definition', null, 'Die Album-Definition wird entfernt — und damit alle Texte, das Layout, Karten, Touren, Audio-Verweise, die du im Album angelegt hast.')}</li>
                                <li>${_t('album_delete.bullet_files', null, 'Der Foto-Ordner und die Bild-Dateien bleiben vollständig erhalten.')}</li>
                                <li>${_t('album_delete.bullet_backup', null, 'Vor dem Löschen wird automatisch eine Sicherungskopie der album.json angelegt (10 Versionen werden vorgehalten).')}</li>
                                <li>${_t('album_delete.bullet_undo', null, 'Direkt nach dem Löschen erscheint 10 Sekunden lang ein „Rückgängig"-Button.')}</li>
                            </ul>
                        </div>
                        <label class="alb-delete-prompt" for="alb-delete-input">
                            ${_t('album_delete.prompt_prefix', null, 'Tippe')} <code>${escapeHtml(titleToMatch)}</code> ${_t('album_delete.prompt_suffix', null, 'exakt zur Bestätigung:')}
                        </label>
                        <input type="text" id="alb-delete-input"
                               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
                        <div class="alb-delete-actions">
                            <button class="alb-delete-cancel" type="button">${_t('album_delete.btn_cancel', null, 'Abbrechen')}</button>
                            <button class="alb-delete-go"     type="button" disabled>${_t('album_delete.btn_confirm', null, 'Endgültig löschen')}</button>
                        </div>
                    </div>`;
                document.body.appendChild(ov);

                const inp    = ov.querySelector('#alb-delete-input');
                const btnGo  = ov.querySelector('.alb-delete-go');
                const btnCnc = ov.querySelector('.alb-delete-cancel');

                let done = false;
                const close = (val) => {
                    if (done) return;
                    done = true;
                    document.removeEventListener('keydown', onKey);
                    ov.remove();
                    resolve(val);
                };
                const onKey = (e) => {
                    if (e.key === 'Escape') {
                        e.preventDefault(); e.stopPropagation();
                        close(false);
                    } else if (e.key === 'Enter' && !btnGo.disabled) {
                        e.preventDefault(); e.stopPropagation();
                        close(true);
                    }
                };
                ov.addEventListener('click', (e) => { if (e.target === ov) close(false); });
                btnCnc.addEventListener('click', () => close(false));
                btnGo.addEventListener('click',  () => close(true));
                inp.addEventListener('input', () => {
                    btnGo.disabled = (inp.value !== titleToMatch);
                });
                document.addEventListener('keydown', onKey);
                setTimeout(() => inp.focus(), 30);
            });
        }

        async function _confirmDeleteAlbum(album) {
            const ok = await _openDeleteConfirmModal(album);
            if (!ok) return;
            try {
                const r = await fetch(
                    `${API_BASE}/api/album/${encodeURIComponent(album.space)}/${encodeURIComponent(album.name)}`,
                    { method: 'DELETE' }
                );
                const data = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(data.detail || r.statusText);
                const backupFilename = data.backup;

                // Snapshot fuer Undo (album-Objekt referenziert das Original — bleibt waehrend des Toast-Fensters gueltig)
                const albumSnap = { space: album.space, name: album.name, title: album.title || album.name };

                allAlbums = allAlbums.filter(a => !(a.space === album.space && a.name === album.name));
                renderAlbums();
                renderStats();

                const _t = (k, vars, fb) => (window.MPD_I18N ? window.MPD_I18N.t(k, vars) : fb) || fb;
                if (typeof window.mpdToast === 'function') {
                    window.mpdToast(_t('album_delete.toast_deleted', { album: albumSnap.title }, `Album „${albumSnap.title}" gelöscht`), {
                        duration: 10000,
                        action  : _t('album_delete.toast_undo_action', null, 'Rückgängig'),
                        onAction: () => _undoDeleteAlbum(albumSnap, backupFilename),
                    });
                } else {
                    alert(_t('album_delete.alert_no_toast', null, 'Album gelöscht. Hinweis: Toast-Modul nicht verfügbar — Undo nur über Backup-Datei möglich.'));
                }
            } catch (err) {
                const _t = (k, vars, fb) => (window.MPD_I18N ? window.MPD_I18N.t(k, vars) : fb) || fb;
                alert(_t('album_delete.alert_delete_failed', { msg: (err.message || err) }, 'Fehler beim Löschen: ' + (err.message || err)));
            }
        }

        async function _undoDeleteAlbum(albumSnap, backupFilename) {
            const _t = (k, vars, fb) => (window.MPD_I18N ? window.MPD_I18N.t(k, vars) : fb) || fb;
            if (!backupFilename) {
                alert(_t('album_delete.alert_no_backup', null, 'Backup-Referenz fehlt — Wiederherstellung nicht möglich.'));
                return;
            }
            try {
                const url = `${API_BASE}/api/album/${encodeURIComponent(albumSnap.space)}/${encodeURIComponent(albumSnap.name)}/undo-delete?backup_filename=${encodeURIComponent(backupFilename)}`;
                const r = await fetch(url, { method: 'POST' });
                const data = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(data.detail || r.statusText);
                // Frische Liste vom Server holen (sicherer als manuelles Re-insert mit potenziell veralteten Stats)
                await loadAlbums();
                if (typeof window.mpdToast === 'function') {
                    window.mpdToast(_t('album_delete.toast_restored', { album: albumSnap.title }, `„${albumSnap.title}" wiederhergestellt`), { duration: 2500 });
                }
            } catch (err) {
                alert(_t('album_delete.alert_restore_failed', { msg: (err.message || err) }, 'Wiederherstellen fehlgeschlagen: ' + (err.message || err)));
            }
        }

        // ── Save-Helper: aktuelles album.json holen + per /update zurueckschreiben ──
        async function _fetchAlbumForEdit(album) {
            const r = await fetch(`${API_BASE}/api/album/${encodeURIComponent(album.space)}/${encodeURIComponent(album.name)}`);
            if (!r.ok) throw new Error(`Album laden: HTTP ${r.status}`);
            return await r.json();
        }
        async function _saveAlbum(album, data) {
            const r = await fetch(
                `${API_BASE}/api/album/${encodeURIComponent(album.space)}/${encodeURIComponent(album.name)}/update`,
                {
                    method : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body   : JSON.stringify(data),
                }
            );
            const d = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(d.detail || `Speichern: HTTP ${r.status}`);
            return d;
        }

        function showError(message) {
            const _warnSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1em;height:1em;vertical-align:-0.12em;margin-right:.4em"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
            document.getElementById('content').innerHTML = `<div class="error"><h2>${_warnSvg}Fehler</h2><p>${escapeHtml(message)}</p></div>`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadAlbums();

        // Memories-Teaser: nur sichtbar wenn heute Erinnerungen da sind.
        async function loadMemoriesTeaser() {
            try {
                // limit=6: dieselbe Auswahl wie die App (Rangfolge im Server,
                // 08.09.2026); total ist die volle Zahl des Tages.
                const r = await fetch(`${API_BASE}/api/memories?limit=6`);
                if (!r.ok) return;
                const data  = await r.json();
                const years = data.years || [];
                if (!years.length) return;
                const total = typeof data.total === 'number' ? data.total
                            : years.reduce((s, y) => s + (y.photos || []).length, 0);
                const tr = (k, vars) => (window.MPD_I18N ? window.MPD_I18N.t(k, vars) : k);
                const word = total === 1 ? tr('index.teaser_memory') : tr('index.teaser_memories');
                let text;
                if (years.length === 1) {
                    const y = years[0];
                    text = tr('index.teaser_single', { ago: y.years_ago, year: y.year, total, word });
                } else {
                    const agos = years.map(y => y.years_ago).sort((a, b) => a - b);
                    const head = agos.slice(0, -1).join(', ');
                    const andc = tr('index.teaser_and');
                    const joined = `${head} ${andc} ${agos[agos.length - 1]}`;
                    text = tr('index.teaser_multi', { ago: joined, total, word });
                }
                document.getElementById('memories-teaser-text').textContent = text;
                document.getElementById('memories-teaser').hidden = false;
                window._memoriesData = data; // fürs Overlay
            } catch (_) { /* silent — Teaser ist optional */ }
        }

        // Memories-Overlay (04.09.2026): Web-Ansicht der Tages-Erinnerungen.
        // Daten kommen aus dem Teaser-Fetch; Klick auf ein Foto öffnet das
        // Album, aus dem es stammt (Space steckt in der Thumbnail-URL).
        function openMemoriesOverlay() {
            const data = window._memoriesData;
            if (!data || !(data.years || []).length) return;
            const tr = (k, vars) => (window.MPD_I18N ? window.MPD_I18N.t(k, vars) : k);
            const overlay = document.getElementById('mem-overlay');
            const body    = document.getElementById('mem-body');
            const title   = document.getElementById('mem-title');
            const tTitle  = tr('index.mem_title', { label: data.label || '' });
            title.textContent = (tTitle === 'index.mem_title')
                ? `Heute vor … — ${data.label || ''}` : tTitle;
            body.textContent = '';
            data.years.forEach(block => {
                const sec = document.createElement('div');
                sec.className = 'mem-year';
                const h = document.createElement('h3');
                const tYear = tr('index.mem_year_head', { ago: block.years_ago });
                h.textContent = (tYear === 'index.mem_year_head')
                    ? `vor ${block.years_ago} Jahren` : tYear;
                const sub = document.createElement('span');
                sub.className = 'mem-year-sub';
                sub.textContent = ` · ${block.year}`;
                h.appendChild(sub);
                sec.appendChild(h);
                const grid = document.createElement('div');
                grid.className = 'mem-grid';
                (block.photos || []).forEach(ph => {
                    const a = document.createElement('a');
                    a.className = 'mem-tile';
                    const space = (ph.thumbnail_url || '').includes('space=personal') ? 'personal' : 'shared';
                    a.href = `/album.html?space=${encodeURIComponent(space)}&name=${encodeURIComponent(ph.album)}`;
                    const img = document.createElement('img');
                    img.loading = 'lazy';
                    img.src = ph.thumbnail_url;
                    img.alt = ph.filename || '';
                    a.appendChild(img);
                    if (ph.location) {
                        const loc = document.createElement('div');
                        loc.className = 'mem-loc';
                        loc.textContent = ph.location;
                        a.appendChild(loc);
                    }
                    grid.appendChild(a);
                });
                sec.appendChild(grid);
                const shown = (block.photos || []).length;
                if (typeof block.total === 'number' && block.total > shown && shown) {
                    const first = block.photos[0];
                    const more = document.createElement('a');
                    more.className = 'mem-more';
                    const sp = (first.thumbnail_url || '').includes('space=personal') ? 'personal' : 'shared';
                    more.href = `/album.html?space=${encodeURIComponent(sp)}&name=${encodeURIComponent(first.album)}`;
                    const tMore = tr('index.mem_more', { n: block.total - shown });
                    more.textContent = (tMore === 'index.mem_more') ? `und ${block.total - shown} weitere` : tMore;
                    sec.appendChild(more);
                }
                body.appendChild(sec);
            });
            overlay.hidden = false;
            document.addEventListener('keydown', _memEsc);
            overlay.addEventListener('click', _memBackdrop);
        }
        function closeMemoriesOverlay() {
            document.getElementById('mem-overlay').hidden = true;
            document.removeEventListener('keydown', _memEsc);
        }
        function _memEsc(e) { if (e.key === 'Escape') closeMemoriesOverlay(); }
        function _memBackdrop(e) { if (e.target === document.getElementById('mem-overlay')) closeMemoriesOverlay(); }
        if (window.MPD_I18N && window.MPD_I18N.onReady) {
            window.MPD_I18N.onReady(loadMemoriesTeaser);
        } else {
            loadMemoriesTeaser();
        }
    </script>

    <script>
        // ── State ────────────────────────────────────────────────────────
        let _cs = { space: '', folderName: '', thumbnail: '', pickerLoaded: false };

        // ── Scan-Modal ───────────────────────────────────────────────────
        async function openScanModal() {
            const _t = (k, vars, fb) => (window.MPD_I18N ? window.MPD_I18N.t(k, vars) : fb) || fb;
            document.getElementById('scan-info').textContent = _t('scan_modal.info_searching', null, 'Suche Ordner ohne Album …');
            document.getElementById('folder-list').innerHTML = '';
            document.getElementById('scan-modal-overlay').classList.add('open');
            _initCreateEmpty();  // PDX v1.4: leeres-Album-Anlegen-Zeile vorbereiten

            try {
                const res  = await fetch(`${API_BASE}/api/albums/without-json`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (!data.folders || data.folders.length === 0) {
                    document.getElementById('scan-info').textContent = _t('scan_modal.info_empty', null, 'Keine Ordner ohne Album gefunden.');
                    return;
                }

                document.getElementById('scan-info').textContent =
                    _t('scan_modal.info_found', { count: data.folders.length }, `${data.folders.length} Ordner gefunden – Ordner auswählen:`);

                const list = document.getElementById('folder-list');
                data.folders.forEach(folder => {
                    const item = document.createElement('div');
                    item.className = 'folder-item';

                    const thumbHtml = folder.first_photo
                        ? `<img class="folder-thumb" src="${API_BASE}/api/thumbnail/${encodeURIComponent(folder.space)}/${encodeURIComponent(folder.folder_name)}/${encodeURIComponent(folder.first_photo)}?size=sm" loading="lazy" decoding="async" alt="">`
                        : `<div class="folder-thumb-placeholder">📁</div>`;

                    const spaceClass = folder.space === 'personal' ? 'personal' : 'shared';
                    const mediaKey = folder.media_count === 1 ? 'scan_modal.media_count_one' : 'scan_modal.media_count_many';
                    const mediaFb = `${folder.media_count} Mediendatei${folder.media_count !== 1 ? 'en' : ''}`;
                    const mediaTxt = _t(mediaKey, { count: folder.media_count }, mediaFb);

                    item.innerHTML = `
                        ${thumbHtml}
                        <div class="folder-info">
                            <div class="folder-name">${escapeHtml(folder.folder_name)}</div>
                            <div class="folder-meta">
                                <span class="space-badge-sm ${spaceClass}">${folder.space}</span>
                                ${mediaTxt}
                            </div>
                        </div>
                    `;
                    item.onclick = () => openCreateModal(folder);
                    list.appendChild(item);
                });
            } catch (e) {
                document.getElementById('scan-info').textContent = _t('scan_modal.info_error', { msg: e.message }, `Fehler: ${escapeHtml(e.message)}`);
            }
        }

        function closeScanModal() {
            document.getElementById('scan-modal-overlay').classList.remove('open');
        }

        document.getElementById('scan-modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeScanModal();
        });

        // ── Erstell-Modal ────────────────────────────────────────────────
        function openCreateModal(folder) {
            closeScanModal();

            _cs = { space: folder.space, folderName: folder.folder_name,
                    thumbnail: folder.first_photo || '', pickerLoaded: false };

            document.getElementById('cm-folder').textContent  = folder.folder_name;
            document.getElementById('cm-title').textContent   = folder.folder_name;
            document.getElementById('create-status').textContent = '';
            document.getElementById('btn-create').disabled    = false;

            const img = document.getElementById('cm-thumb-img');
            if (folder.first_photo) {
                img.src = `${API_BASE}/api/thumbnail/${encodeURIComponent(folder.space)}/${encodeURIComponent(folder.folder_name)}/${encodeURIComponent(folder.first_photo)}?size=sm`;
                document.getElementById('cm-thumb-change').style.display = '';
            } else {
                img.src = '';
                document.getElementById('cm-thumb-change').style.display = 'none';
            }

            const picker = document.getElementById('thumb-picker');
            picker.classList.remove('open');
            picker.innerHTML = '';

            document.getElementById('create-modal-overlay').classList.add('open');
        }

        function closeCreateModal() {
            document.getElementById('create-modal-overlay').classList.remove('open');
            document.getElementById('thumb-picker').classList.remove('open');
        }

        document.getElementById('create-modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeCreateModal();
        });

        // ESC schließt das jeweils oberste offene Modal.
        // Reihenfolge wichtig: Thumb-Picker > Create-Modal > Scan-Modal.
        document.addEventListener('keydown', function(e) {
            if (e.key !== 'Escape') return;
            const picker = document.getElementById('thumb-picker');
            if (picker && picker.classList.contains('open')) {
                picker.classList.remove('open');
                return;
            }
            const createOv = document.getElementById('create-modal-overlay');
            if (createOv && createOv.classList.contains('open')) {
                closeCreateModal();
                return;
            }
            const scanOv = document.getElementById('scan-modal-overlay');
            if (scanOv && scanOv.classList.contains('open')) {
                closeScanModal();
                return;
            }
        });

        // ── Thumbnail-Picker ─────────────────────────────────────────────
        async function openThumbPicker() {
            const picker = document.getElementById('thumb-picker');
            picker.classList.toggle('open');
            if (!picker.classList.contains('open') || _cs.pickerLoaded) return;

            picker.innerHTML = '<div class="thumb-picker-msg">Lade Fotos …</div>';
            try {
                const res  = await fetch(`${API_BASE}/api/album/files?space=${encodeURIComponent(_cs.space)}&folder=${encodeURIComponent(_cs.folderName)}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                picker.innerHTML = '';
                data.files.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'thumb-picker-item' + (file.filename === _cs.thumbnail ? ' selected' : '');
                    item.innerHTML = `<img src="${API_BASE}${file.thumbnail}" loading="lazy" decoding="async" alt="${escapeHtml(file.filename)}">`;
                    item.onclick = () => selectThumbnail(file.filename, item);
                    picker.appendChild(item);

                    // Zoom preview (hover loupe + long press) — same as Mixed-Picker.
                    if (typeof window.attachZoomTrigger === 'function') {
                        const xlUrl = `${API_BASE}/api/thumbnail/${encodeURIComponent(_cs.space)}/${encodeURIComponent(_cs.folderName)}/${encodeURIComponent(file.filename)}?size=xl`;
                        window.attachZoomTrigger(item, xlUrl, { alt: file.filename });
                    }
                });
                _cs.pickerLoaded = true;
            } catch (e) {
                picker.innerHTML = `<div class="thumb-picker-msg">Fehler: ${escapeHtml(e.message)}</div>`;
            }
        }

        function selectThumbnail(filename, itemEl) {
            _cs.thumbnail = filename;
            document.querySelectorAll('.thumb-picker-item').forEach(el => el.classList.remove('selected'));
            itemEl.classList.add('selected');
            document.getElementById('cm-thumb-img').src =
                `${API_BASE}/api/thumbnail/${encodeURIComponent(_cs.space)}/${encodeURIComponent(_cs.folderName)}/${encodeURIComponent(filename)}?size=sm`;
            document.getElementById('thumb-picker').classList.remove('open');
        }

        // ── Album erstellen ──────────────────────────────────────────────
        async function submitCreateAlbum() {
            if (!_cs.thumbnail) {
                document.getElementById('create-status').textContent = 'Kein Titelbild gewählt.';
                return;
            }
            const btn    = document.getElementById('btn-create');
            const status = document.getElementById('create-status');
            btn.disabled = true;
            status.textContent = 'Erstelle Album …';

            try {
                const res = await fetch(`${API_BASE}/api/album/create`, {
                    method : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body   : JSON.stringify({
                        space      : _cs.space,
                        folder_name: _cs.folderName,
                        thumbnail  : _cs.thumbnail,
                    }),
                });
                const data = await res.json();
                if (!res.ok) {
                    status.textContent = `Fehler: ${data.detail || res.status}`;
                    btn.disabled = false;
                    return;
                }
                status.textContent = `✓ Album erstellt (${data.elements} Elemente)`;
                setTimeout(() => {
                    closeCreateModal();
                    allAlbums = [];
                    document.getElementById('content').innerHTML = '<div class="loading">Lade Alben …</div>';
                    loadAlbums();
                }, 800);
            } catch (e) {
                status.textContent = `Fehler: ${e.message}`;
                btn.disabled = false;
            }
        }

        // ── PDX v1.4: leeres Mixed-Album anlegen ─────────────────────────
        async function _initCreateEmpty() {
            const nameInput = document.getElementById('cm-new-name');
            const status    = document.getElementById('cm-create-empty-status');
            const btn       = document.getElementById('btn-create-empty');
            const row       = document.getElementById('cm-space-row');

            nameInput.value      = '';
            status.textContent   = '';
            btn.disabled         = false;
            row.style.display    = 'none';
            row.innerHTML        = '';
            row.dataset.defaultSpace = '';

            try {
                const res = await fetch(`${API_BASE}/api/spaces-writable`);
                if (!res.ok) return;
                const data   = await res.json();
                const spaces = data.spaces || [];
                if (spaces.length === 0) {
                    btn.disabled = true;
                    status.textContent = 'Kein schreibbarer Space verfügbar.';
                    return;
                }
                row.dataset.defaultSpace = spaces[0];
                if (spaces.length > 1) {
                    row.style.display = 'flex';
                    spaces.forEach((s, i) => {
                        const lbl = document.createElement('label');
                        lbl.style.cssText = 'display:flex;align-items:center;gap:.25rem;cursor:pointer';
                        lbl.innerHTML = `<input type="radio" name="cm-space" value="${escapeHtml(s)}" ${i === 0 ? 'checked' : ''}> ${escapeHtml(s)}`;
                        row.appendChild(lbl);
                    });
                }
            } catch (_) {
                // silently — Backend lehnt im Zweifel ab, Fehler erscheint dann oben
            }
        }

        function _selectedEmptySpace() {
            const row = document.getElementById('cm-space-row');
            const checked = row.querySelector('input[name="cm-space"]:checked');
            return checked ? checked.value : (row.dataset.defaultSpace || '');
        }

        async function submitCreateEmpty() {
            const nameInput = document.getElementById('cm-new-name');
            const status    = document.getElementById('cm-create-empty-status');
            const btn       = document.getElementById('btn-create-empty');
            const name      = nameInput.value.trim();

            if (!name) {
                status.textContent = 'Bitte einen Namen eingeben.';
                nameInput.focus();
                return;
            }
            const space = _selectedEmptySpace();
            if (!space) {
                status.textContent = 'Kein Space verfügbar.';
                return;
            }

            btn.disabled = true;
            status.textContent = 'Lege Album an …';

            try {
                const res = await fetch(`${API_BASE}/api/album/create-empty`, {
                    method : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body   : JSON.stringify({ space, folder_name: name }),
                });
                const data = await res.json();
                if (!res.ok) {
                    status.textContent = data.detail || `Fehler ${res.status}`;
                    btn.disabled = false;
                    return;
                }
                // Direkt ins neue Album — leeres Album öffnet auto im Edit-Mode.
                window.location.href = `/album.html?space=${encodeURIComponent(data.space)}&name=${encodeURIComponent(data.folder_name)}`;
            } catch (e) {
                status.textContent = `Fehler: ${e.message}`;
                btn.disabled = false;
            }
        }

        // Enter im Name-Input loest Anlegen aus
        document.getElementById('cm-new-name').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitCreateEmpty();
            }
        });
    </script>
    <script src="/js/search.js"></script>
    <script src="/js/theme.js?v=3"></script>
    <script src="/js/photo-zoom.js"></script>
</body>
