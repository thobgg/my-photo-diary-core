    <script>
    // WebView-recreation recovery: Android can destroy+recreate the WebView
    // Activity on orientation change, landing on index.html instead of the
    // album the user had open. If localStorage has a recent album URL (< 12s)
    // and goBack() did NOT set the intentional-nav flag, redirect back.
    (function() {
        try {
            var r = localStorage.getItem('mpd-resume');
            if (!r) return;
            var d = JSON.parse(r);
            if (d && d.url && (Date.now() - d.ts) < 60000) {
                localStorage.removeItem('mpd-resume');
                location.replace(d.url);
            } else {
                localStorage.removeItem('mpd-resume');
            }
        } catch(e) {}
    })();
    </script>

    <script>
        const API_BASE = window.location.origin;
        let allAlbums = [];
        let spaceFilter = 'all';
        let isDemo = false;
        let currentRole = '';   // 'admin' | 'editor' | 'viewer' | ''
        // Freigeschaltete Zusatzmodule (aus /api/whoami). null = unbekannt/alle
        // (z.B. whoami-Fehler) → nichts ausblenden.
        let userModules = null;
        const hasModule = (k) => !userModules || userModules.includes(k);

        // "Über"-Dialog — vom anklickbaren Versions-Badge im Hamburger-Menü.
        // Schlanker eigener <dialog>, der die vorhandenen .mpd-dialog-Styles
        // wiederverwendet. Inhalt bewusst minimal und wahr: Name, Slogan,
        // Version, Build-Datum, Autor (kein Handbuch-Link — /docs wird nicht
        // serviert).
        async function _openAboutDialog() {
            const en  = window.MPD_I18N && window.MPD_I18N.getLang && window.MPD_I18N.getLang() === 'en';
            let version = '', build = '';
            try {
                const r = await fetch('/api/version', { cache: 'no-store' });
                const d = await r.json();
                version = d.version ? ('v' + d.version) : '';
                build   = d.build_date || '';
            } catch (_) { /* offline: Dialog trotzdem zeigen */ }

            const row = (k, v) => v
                ? `<div style="display:flex;justify-content:space-between;gap:16px;padding:3px 0;font-size:.85rem"><span style="color:var(--text-muted)">${k}</span><span>${v}</span></div>`
                : '';

            const dlg = document.createElement('dialog');
            dlg.className = 'mpd-dialog';
            dlg.innerHTML =
                `<div class="mpd-dialog__inner">
                    <img src="/img/brand/mpd-logo.svg" alt="" style="width:48px;height:48px;margin:0 auto 8px;display:block">
                    <h2 class="mpd-dialog__title" style="text-align:center">My Photo Diary</h2>
                    <div class="mpd-dialog__subtitle" style="text-align:center">where your memories stay yours.</div>
                    <div class="mpd-dialog__body" style="margin-top:12px">
                        ${row('Version', version)}
                        ${row('Build', build)}
                        ${row(en ? 'Author' : 'Autor', 'Thomas Bugge')}
                    </div>
                    <div class="mpd-dialog__actions">
                        <button class="mpd-dialog__btn mpd-dialog__btn--confirm">${en ? 'Close' : 'Schließen'}</button>
                    </div>
                </div>`;
            document.body.appendChild(dlg);
            const close = () => { try { dlg.close(); } catch (_) {} setTimeout(() => dlg.remove(), 160); };
            dlg.querySelector('.mpd-dialog__btn').addEventListener('click', close);
            dlg.addEventListener('click', (e) => { if (e.target === dlg) close(); });
            dlg.addEventListener('cancel', (e) => { e.preventDefault(); close(); });
            dlg.showModal();
            dlg.querySelector('.mpd-dialog__btn').focus();
        }
        let appSettings = {     // globale Feature-Schalter, via /api/settings
            share_enabled        : true,
            demo_enabled         : true,
            memories_push_enabled: true,
        };

        async function loadAppSettings() {
            try {
                const r = await fetch(`${API_BASE}/api/settings`);
                if (!r.ok) return;
                const d = await r.json();
                appSettings = { ...appSettings, ...d };
            } catch { /* stumm, Defaults bleiben */ }
        }

        function _canEditAlbum(album) {
            if (isDemo) return false;
            if (currentRole === 'admin')  return true;
            if (currentRole === 'editor') return album.space === 'personal';
            return false;
        }

        async function loadAlbums() {
            try {
                // whoami parallel starten, aber nicht awaiten — sonst blockt die
                // UI-Render-Zeit auf den (potenziell langsamen) whoami-Roundtrip.
                const whoamiPromise = fetch(`${API_BASE}/api/whoami`).then(r => r.json()).catch(() => ({}));

                const response = await fetch(`${API_BASE}/api/albums`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                allAlbums = data.albums;

                renderAlbums();
                renderStats();
                // Sprung aus der Durchlauf-Ansicht: /?scan=1 oeffnet „Album hinzufuegen"
                if (new URLSearchParams(location.search).get('scan') === '1') {
                    history.replaceState(null, '', '/');
                    openScanModal();
                }

                // Rolle/Avatar/Demo-Flag nachziehen, sobald whoami da ist.
                // Settings parallel holen.
                loadAppSettings().then(() => renderAlbums());
                whoamiPromise.then(whoami => {
                    const username = whoami.user || '';
                    const role     = whoami.role || '';
                    isDemo      = !!whoami.is_demo;
                    currentRole = role;
                    userModules = Array.isArray(whoami.modules) ? whoami.modules : null;
                    window.MPD_MODULES = userModules;
                    // Gesperrte Module (09.09.2026): im MENUE
                    // sichtbar lassen, mit Schloss, Antippen oeffnet das Schaufenster —
                    // was kann das Modul, wie schaltet man es frei. Aus der KOPFZEILE
                    // (Suchfeld, Kacheln) bleiben sie draussen: die ist Arbeitsflaeche.
                    [['tours','hamburger-item-tours'], ['trails','hamburger-item-trails'],
                     ['search','hamburger-item-search'], ['stats','hamburger-item-stats']]
                        .forEach(([mod, id]) => {
                            if (hasModule(mod)) return;
                            const el = document.getElementById(id);
                            if (!el) return;
                            el.classList.add('locked');
                            el.onclick = () => { document.getElementById('hamburger-menu').style.display = 'none'; _openPlusWindow(mod); };
                        });
                    if (!hasModule('search')) { const sw = document.getElementById('mpd-search-wrap'); if (sw) sw.style.display = 'none'; }
                    // Albums neu zeichnen, damit Kebab-Menue (rollenabhaengig) auftaucht
                    renderAlbums();
                    _loadDurchlaufCount(whoami);

                    if (isDemo) {
                        const searchWrap = document.getElementById('mpd-search-wrap');
                        if (searchWrap) searchWrap.style.display = 'none';
                        // Demo sieht nur den eigenen Bereich (available_spaces) —
                        // der Shared-Filter fände nie etwas und sah aus wie ein Fehler.
                        const sharedBtn = document.querySelector('.space-filter-btn[data-val="shared"]');
                        if (sharedBtn) sharedBtn.style.display = 'none';
                        for (const id of ['hamburger-item-tours', 'hamburger-item-trails']) {
                            const el = document.getElementById(id);
                            if (el) el.style.display = 'none';
                        }

                        if (teaser) teaser.hidden = true;
                    }
                    document.getElementById('avatar-initial').textContent = username ? username[0].toUpperCase() : '?';
                    document.getElementById('user-avatar').title = `${username} · ${role}`;
                    document.getElementById('user-role').textContent = role;
                    document.getElementById('menu-username').textContent = username;
                    document.getElementById('menu-role').textContent = role;

                    if (role !== 'admin' && role !== 'editor') {
                        const menu = document.getElementById('hamburger-menu');
                        if (menu) menu.style.display = 'none';
                    }
                    if (role === 'admin' || role === 'editor') {
                        const btn = document.getElementById('btn-add-album');
                        if (btn) btn.style.display = 'inline-block';
                        const fab = document.getElementById('fab-add-album');
                        if (fab) fab.classList.add('visible');
                    }
                    if (role === 'admin') {
                        const ua = document.getElementById('hamburger-users-admin');
                        if (ua) ua.style.display = '';
                    }
                    // Stats neu zeichnen (isDemo beeinflusst Stats-Pills)
                    renderStats();
                });
            } catch (error) {
                showError(error.message);
            }
        }

        function renderStats() {
            const statsEl = document.getElementById('header-stats');
            if (!statsEl) return;
            const filtered = spaceFilter === 'all' ? allAlbums
                : allAlbums.filter(a => a.space === spaceFilter);
            const totalAlbums = filtered.length;
            const totalPhotos = filtered.reduce((sum, a) => sum + (a.photo_count || 0), 0);
            const totalVideos = filtered.reduce((sum, a) => sum + (a.video_count || 0), 0);
            // Stat-pill-Icons im selben Lucide-Vokabular wie Header/Lightbox.
            const _SVG = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
            const SP_FOLDER = `<svg viewBox="0 0 24 24" ${_SVG}><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;
            const SP_PHOTO  = `<svg viewBox="0 0 24 24" ${_SVG}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`;
            const SP_VIDEO  = `<svg viewBox="0 0 24 24" ${_SVG}><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>`;
            const SP_STATS  = `<svg viewBox="0 0 24 24" ${_SVG}><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>`;
            const SP_MAP    = `<svg viewBox="0 0 24 24" ${_SVG}><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>`;
            const SP_COMPASS = `<svg viewBox="0 0 24 24" ${_SVG}><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>`;
            // Zwei Gruppen, die bisher gleich aussahen (08.09.2026): links
            // die ZAHLEN (Anzeige, nicht klickbar, matt ohne Rahmen), dann ein
            // Abstand, dann die EINSTIEGE als Knoepfe — Reihenfolge nach „wie
            // oft schaut man hin": Durchlauf (traegt Zahl, meldet Arbeit),
            // Trails (taeglich), Tours (beim Gestalten), Stats (selten),
            // Themes (aendert Aussehen, nicht Inhalt). Gleiche Reihe in der App.
            const _tn = (k, fb) => (window.MPD_I18N ? window.MPD_I18N.t(k) : fb) || fb;
            let html = `<div class="stat-pill stat-pill--count">${SP_FOLDER}<strong>${totalAlbums}</strong> Alben</div>`;
            html += `<div class="stat-pill stat-pill--count">${SP_PHOTO}<strong>${totalPhotos.toLocaleString('de-DE')}</strong> Fotos</div>`;
            if (totalVideos > 0) html += `<div class="stat-pill stat-pill--count">${SP_VIDEO}<strong>${totalVideos}</strong> Videos</div>`;
            if (!isDemo) {
                html += `<span class="stat-pill-gap" aria-hidden="true"></span>`;
                // Durchlauf (Grundpaket): Zaehler kommt asynchron aus
                // /api/timeline?referenced=false (s. _loadDurchlaufCount).
                const SP_INBOX = `<svg viewBox="0 0 24 24" ${_SVG}><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>`;
                const SP_THEME = `<svg viewBox="0 0 24 24" ${_SVG}><circle cx="13.5" cy="6.5" r="1.2" fill="currentColor"/><circle cx="17.5" cy="10.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="7.5" r="1.2" fill="currentColor"/><circle cx="6.5" cy="12.5" r="1.2" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c3.31 0 6-2.69 6-6 0-5.17-4.5-9-10-9z"/></svg>`;
                html += `<a href="/durchlauf" id="durchlauf-pill" class="stat-pill stat-pill--btn" style="color:#e8a030;border-color:rgba(232,160,48,.3)">${SP_INBOX}${_tn('nav.item_durchlauf', 'Durchlauf')}<span id="durchlauf-pill-count"></span></a>`;
                if (hasModule('trails')) html += `<a href="/trails" class="stat-pill stat-pill--btn" style="color:#7ec8e3;border-color:rgba(126,200,227,.3)">${SP_COMPASS}${_tn('nav.item_trails', 'Trails')}</a>`;
                if (hasModule('tours'))  html += `<a href="/tours" class="stat-pill stat-pill--btn" style="color:#43c98c;border-color:rgba(67,201,140,.3)">${SP_MAP}${_tn('nav.item_tours', 'Tours')}</a>`;
                if (hasModule('stats'))  html += `<a href="/stats" class="stat-pill stat-pill--btn" style="color:#f0c040;border-color:rgba(240,192,64,.3)">${SP_STATS}${_tn('nav.item_stats', 'Stats')}</a>`;
                html += `<button type="button" class="stat-pill stat-pill--btn" style="color:#b48ee6;border-color:rgba(180,142,230,.3)" onclick="toggleThemePicker()">${SP_THEME}${_tn('nav.item_themes', 'Themes')}</button>`;
                if (typeof _durchlaufTotal === 'number') _renderDurchlaufCount();
            }
            statsEl.innerHTML = html;
        }

        // Durchlauf-Zaehler fuer die Kachel: alles Unzugeordnete in den
        // Bestaenden, in denen das Konto beitragen darf. Ein Aufruf je
        // Bestand mit limit=1 — total kommt aus dem Server.
        let _durchlaufTotal = null;
        function _renderDurchlaufCount() {
            const el = document.getElementById('durchlauf-pill-count');
            if (el) el.textContent = _durchlaufTotal > 0 ? ` · ${_durchlaufTotal}` : '';
        }
        async function _loadDurchlaufCount(whoami) {
            const rights = (whoami && whoami.rights) || {};
            const spaces = ['shared', 'personal'].filter(s => (rights[s] || []).includes('contribute'));
            const pill = document.getElementById('durchlauf-pill');
            const item = document.getElementById('hamburger-item-durchlauf');
            if (!spaces.length) { if (pill) pill.style.display = 'none'; if (item) item.style.display = 'none'; return; }
            try {
                const totals = await Promise.all(spaces.map(s =>
                    fetch(`${API_BASE}/api/timeline?space=${s}&referenced=false&folder=durchlauf,album&limit=1`)
                        .then(r => r.ok ? r.json() : { total: 0 }).then(d => d.total || 0)));
                _durchlaufTotal = totals.reduce((a, b) => a + b, 0);
                _renderDurchlaufCount();
            } catch (_) {}
        }

        // Schaufenster fuer ein gesperrtes Modul: ein Absatz, was es kann, und
        // der Weg zur Freischaltung. Kein Kaufknopf — MPD hat keinen Shop.
        function _openPlusWindow(mod) {
            const _t = (k, vars, fb) => (window.MPD_I18N ? window.MPD_I18N.t(k, vars) : fb) || fb;
            const name = _t('nav.item_' + mod, null, mod);
            if (typeof window.mpdAlert !== 'function') return;
            window.mpdAlert({
                icon : '🔒',
                title: _t('plus.locked_title', { name }, name + ' gehört zu MPD Plus'),
                body : _t('plus.desc_' + mod, null, '') + '\n\n' + _t('plus.how', null, 'Freischalten: Der Verwalter trägt die Plus-Lizenz in den Einstellungen ein.'),
            });
        }

        function toggleHamburger() {
            const menu = document.getElementById('hamburger-menu');
            menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
        }
        // Sprach-Umschalter-Label: zeigt immer die Alternativ-Sprache.
        // Globe-SVG bleibt im Button — wir tauschen nur den Text-Span.
        document.addEventListener('mpd-i18n-ready', e => {
            const label = document.getElementById('hamburger-lang-toggle-label');
            if (!label) return;
            label.textContent = (e.detail.lang === 'de') ? 'English' : 'Deutsch';
        });
        function toggleUserMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('user-menu');
            menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
        }
        async function doLogout() {
            await fetch(`${API_BASE}/api/logout`, {method: 'POST'});
            window.location.href = '/login';
        }
        document.addEventListener('click', e => {
            if (!e.target.closest('#hamburger-btn') && !e.target.closest('#hamburger-menu')) {
                const menu = document.getElementById('hamburger-menu');
                if (menu) menu.style.display = 'none';
            }
            if (!e.target.closest('#user-avatar')) {
                const um = document.getElementById('user-menu');
                if (um) um.style.display = 'none';
            }
        });

        function setSpaceFilter(val, btn) {
            spaceFilter = val;
            document.querySelectorAll('.space-filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            const menu = document.getElementById('hamburger-menu');
            if (menu) menu.style.display = 'none';
            renderAlbums();
            renderStats();
        }

        function getFilteredAlbums() {
            const albums = spaceFilter === 'all' ? allAlbums
                : allAlbums.filter(a => a.space === spaceFilter);
            return [...albums].sort((a, b) => a.title.localeCompare(b.title, 'de'));
        }

        function sortAlbums(albums, sortBy) {
            const sorted = [...albums]; // Kopie erstellen
            
            switch(sortBy) {
                case 'year-desc':
                    // Neueste zuerst (Google Photos Style)
                    return sorted.sort((a, b) => {
                        const yearA = parseInt(a.year) || 0;
                        const yearB = parseInt(b.year) || 0;
                        return yearB - yearA;
                    });
                
                case 'year-asc':
                    // Älteste zuerst
                    return sorted.sort((a, b) => {
                        const yearA = parseInt(a.year) || 0;
                        const yearB = parseInt(b.year) || 0;
                        return yearA - yearB;
                    });
                
                case 'title-asc':
                    // Titel A-Z
                    return sorted.sort((a, b) => a.title.localeCompare(b.title, 'de'));
                
                case 'title-desc':
                    // Titel Z-A
                    return sorted.sort((a, b) => b.title.localeCompare(a.title, 'de'));
                
                default:
                    return sorted;
            }
        }

        function changeSorting() {
            const select = document.getElementById('sort-select');
            currentSort = select.value;
            renderAlbums(sortAlbums(allAlbums, currentSort));
        }

        function renderAlbums() {
            const albums = getFilteredAlbums();
            const content = document.getElementById('content');
            if (albums.length === 0) {
                content.innerHTML = '<div class="error"><h2>Keine Alben gefunden</h2></div>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'album-grid';

            albums.forEach(album => {
                const card = createAlbumCard(album);
                grid.appendChild(card);
            });

            content.innerHTML = '';
            content.appendChild(grid);
        }

        function createAlbumCard(album) {
            const card = document.createElement('div');
            card.className = `album-card space-${album.space}`;
            card.onclick = () => window.location.href = `/album.html?space=${encodeURIComponent(album.space)}&name=${encodeURIComponent(album.name)}`;

            const thumbnailUrl = `${API_BASE}/api/thumbnail/${encodeURIComponent(album.space)}/${encodeURIComponent(album.name)}/${encodeURIComponent(album.thumbnail)}?size=sm`;

            // Gesamt-Elementzahl (Foto + Video) als ein Wert — minimalistisch,
            // knapp, theme-übergreifend angemessen.
            const total = (album.photo_count || 0) + (album.video_count || 0);
            const stats = total === 0 ? '' : (total === 1 ? '1 Element' : `${total} Elemente`);

            const badgeLabel = album.space === 'personal' ? 'personal' : 'shared';

            card.innerHTML = `
                <div class="album-cover">
                    <div class="album-cover-blur" aria-hidden="true" style="background-image:url('${thumbnailUrl}')"></div>
                    <img class="album-cover-img" src="${thumbnailUrl}" alt="${escapeHtml(album.title)}" loading="lazy" decoding="async">
                </div>
                <div class="album-info">
                    <span class="space-badge ${badgeLabel}">${badgeLabel}</span>
                    <div class="album-title">${escapeHtml(album.title)}</div>
                    ${stats ? `<div class="album-stats">${stats}</div>` : ''}
                    ${album.description ? `<div class="album-description">${escapeHtml(album.description)}</div>` : ''}
                </div>
            `;

            // Phase A: Cover-Vorschau via Lupe (Hover) / Long-Press (Touch).
            // Klick auf Lupe stoppt Bubbling -> card.onclick navigiert nicht.
            // Long-Press unterdrueckt den synth. click ueber Window-Capture.
            const coverEl = card.querySelector('.album-cover');
            if (coverEl) {
                // Gespeicherten Crop ggf. anwenden (CSS-Variablen)
                if (album.thumbnail_crop) _applyCropToCover(coverEl, album.thumbnail_crop);

                // Lupe = Crop-Editor-Trigger (Hover sichtbar auf Desktop, dauerhaft sichtbar auf Touch)
                const lupe = document.createElement('button');
                lupe.type = 'button';
                lupe.className = 'alb-crop-lupe';
                lupe.title = 'Cover-Ausschnitt waehlen';
                lupe.setAttribute('aria-label', 'Cover-Ausschnitt waehlen');
                lupe.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
                lupe.addEventListener('click', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    _openAlbumCropEditor(album, card);
                });
                coverEl.appendChild(lupe);
            }

            // Phase B: Kebab-Menue (Umbenennen, Deckblatt, Loeschen, Teilen-Hinweis).
            // Nur wenn aktueller User dieses Album bearbeiten darf.
            if (coverEl && _canEditAlbum(album)) {
                const kebab = document.createElement('button');
                kebab.type = 'button';
                kebab.className = 'alb-kebab';
                kebab.title = 'Album-Aktionen';
                kebab.setAttribute('aria-label', 'Album-Aktionen');
                kebab.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>';
                kebab.addEventListener('click', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    // Toggle: zweiter Klick auf denselben Kebab schliesst
                    if (_openPopover && _openPopover._owner === kebab) {
                        _closeAlbumPopover();
                    } else {
                        _openAlbumActionsPopover(card, album, kebab);
                    }
                });
                coverEl.appendChild(kebab);
            }

            return card;
        }

        // ── Cover-Crop: Render & Helpers ──────────────────────────────
        function _applyCropToCover(coverEl, crop) {
            if (!coverEl || !crop) return;
            coverEl.classList.add('has-crop');
            coverEl.style.setProperty('--cx', crop.x);
            coverEl.style.setProperty('--cy', crop.y);
            coverEl.style.setProperty('--cw', crop.w);
            coverEl.style.setProperty('--ch', crop.h);
        }
        function _clearCropFromCover(coverEl) {
            if (!coverEl) return;
            coverEl.classList.remove('has-crop');
            ['--cx','--cy','--cw','--ch'].forEach(k => coverEl.style.removeProperty(k));
        }

        // ── Crop-Editor (Modal) ───────────────────────────────────────
        async function _openAlbumCropEditor(album, card) {
            if (!album.thumbnail) {
                alert('Kein Cover-Foto gewaehlt — bitte erst „Deckblatt aendern".');
                return;
            }
            const baseUrl = `${API_BASE}/api/thumbnail/${encodeURIComponent(album.space)}/${encodeURIComponent(album.name)}/${encodeURIComponent(album.thumbnail)}`;

            const ov = document.createElement('div');
            ov.className = 'alb-cropedit-overlay';
            ov.innerHTML = `
                <div class="alb-cropedit-box" role="dialog" aria-modal="true">
                    <div class="alb-cropedit-header">
                        <h3>Cover-Ausschnitt — „${escapeHtml(album.title || album.name)}"</h3>
                        <button type="button" aria-label="Schliessen">&times;</button>
                    </div>
                    <div class="alb-cropedit-body">
                        <div class="alb-cropedit-stage" id="alb-cropedit-stage">
                            <img class="alb-cropedit-img" id="alb-cropedit-img" alt="" decoding="async">
                            <div class="alb-cropedit-frame" id="alb-cropedit-frame" style="display:none">
                                <div class="alb-cropedit-handle tl" data-corner="tl"></div>
                                <div class="alb-cropedit-handle tr" data-corner="tr"></div>
                                <div class="alb-cropedit-handle bl" data-corner="bl"></div>
                                <div class="alb-cropedit-handle br" data-corner="br"></div>
                            </div>
                        </div>
                        <div class="alb-cropedit-preview">
                            <span>So sieht die Kachel aus:</span>
                            <div class="alb-cropedit-preview-box" id="alb-cropedit-preview">
                                <img id="alb-cropedit-prev-img" alt="">
                            </div>
                        </div>
                        <div class="alb-cropedit-status" id="alb-cropedit-status">Lade Foto …</div>
                    </div>
                    <div class="alb-cropedit-actions">
                        <button class="alb-cropedit-cancel" type="button">Abbrechen</button>
                        <button class="alb-cropedit-save"   type="button" disabled>Speichern</button>
                    </div>
                </div>`;
            document.body.appendChild(ov);

            const stage   = ov.querySelector('#alb-cropedit-stage');
            const img     = ov.querySelector('#alb-cropedit-img');
            const frame   = ov.querySelector('#alb-cropedit-frame');
            const prevBox = ov.querySelector('#alb-cropedit-preview');
            const prevImg = ov.querySelector('#alb-cropedit-prev-img');
            const status  = ov.querySelector('#alb-cropedit-status');
            const btnSave = ov.querySelector('.alb-cropedit-save');
            const btnCnc  = ov.querySelector('.alb-cropedit-cancel');
            const btnX    = ov.querySelector('.alb-cropedit-header button');

            prevImg.src = `${baseUrl}?size=m`;
            img.src     = `${baseUrl}?size=full`;

            let dispW = 0, dispH = 0;
            let crop  = { x: 0, y: 0, side: 0 };
            let dragging = null;

            const close = () => {
                ov.remove();
                document.removeEventListener('keydown', onKey);
                window.removeEventListener('resize', onResize);
            };
            const onKey = (e) => {
                if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
                else if (e.key === 'Enter' && !btnSave.disabled) { e.preventDefault(); save(); }
            };
            const onResize = () => {
                if (!img.complete || !img.naturalWidth) return;
                // Display-Dimensions koennen sich beim Resize aendern. Aktuelle
                // Crop in normalisiert merken, neu in Display-Pixel umrechnen.
                const norm = _toNormalized(crop);
                _measureDisplay();
                _setCrop({
                    x: norm.x * dispW,
                    y: norm.y * dispH,
                    side: Math.min(norm.w * dispW, norm.h * dispH),
                });
            };
            ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
            btnX.addEventListener('click', close);
            btnCnc.addEventListener('click', close);
            btnSave.addEventListener('click', save);
            document.addEventListener('keydown', onKey);
            window.addEventListener('resize', onResize);

            img.addEventListener('error', () => {
                status.textContent = 'Foto konnte nicht geladen werden.';
            });
            img.addEventListener('load', () => {
                _measureDisplay();
                let initial;
                if (album.thumbnail_crop) {
                    const c = album.thumbnail_crop;
                    initial = {
                        x: c.x * dispW,
                        y: c.y * dispH,
                        side: Math.min(c.w * dispW, c.h * dispH),
                    };
                } else {
                    const side = Math.min(dispW, dispH) * 0.85;
                    initial = { x: (dispW - side) / 2, y: (dispH - side) / 2, side };
                }
                _setCrop(initial);
                frame.style.display = '';
                btnSave.disabled = false;
                status.textContent = 'Verschiebe den Rahmen oder ziehe an den Ecken.';
            });

            function _measureDisplay() {
                dispW = img.clientWidth;
                dispH = img.clientHeight;
                stage.style.width  = dispW + 'px';
                stage.style.height = dispH + 'px';
            }

            function _toNormalized(c) {
                if (!dispW || !dispH) return { x: 0, y: 0, w: 1, h: 1 };
                return {
                    x: c.x / dispW,
                    y: c.y / dispH,
                    w: c.side / dispW,
                    h: c.side / dispH,
                };
            }

            function _setCrop(c) {
                const minSide = Math.max(20, Math.min(dispW, dispH) * 0.05);
                c.side = Math.max(minSide, Math.min(c.side, Math.min(dispW, dispH)));
                c.x = Math.max(0, Math.min(c.x, dispW - c.side));
                c.y = Math.max(0, Math.min(c.y, dispH - c.side));
                crop = c;
                frame.style.left   = c.x   + 'px';
                frame.style.top    = c.y   + 'px';
                frame.style.width  = c.side + 'px';
                frame.style.height = c.side + 'px';
                _updatePreview();
            }
            function _updatePreview() {
                const n = _toNormalized(crop);
                prevBox.style.setProperty('--cx', n.x);
                prevBox.style.setProperty('--cy', n.y);
                prevBox.style.setProperty('--cw', n.w);
                prevBox.style.setProperty('--ch', n.h);
            }

            // ── Drag / Resize via Pointer Events ──
            frame.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                try { frame.setPointerCapture(e.pointerId); } catch (_) {}
                const handle = e.target.closest('.alb-cropedit-handle');
                if (handle) {
                    dragging = { type: 'resize', corner: handle.dataset.corner, sx: e.clientX, sy: e.clientY, start: { ...crop } };
                } else {
                    dragging = { type: 'move', sx: e.clientX, sy: e.clientY, start: { ...crop } };
                }
            });
            frame.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                e.preventDefault();
                const dx = e.clientX - dragging.sx;
                const dy = e.clientY - dragging.sy;
                if (dragging.type === 'move') {
                    _setCrop({
                        x   : dragging.start.x + dx,
                        y   : dragging.start.y + dy,
                        side: dragging.start.side,
                    });
                } else {
                    _resizeFromCorner(dragging.start, dragging.corner, dx, dy);
                }
            });
            const endDrag = () => { dragging = null; };
            frame.addEventListener('pointerup',     endDrag);
            frame.addEventListener('pointercancel', endDrag);

            function _resizeFromCorner(start, corner, dx, dy) {
                // Anker = der gegenueberliegende Eckpunkt; bleibt fix.
                const ax = (corner === 'tl' || corner === 'bl') ? start.x + start.side : start.x;
                const ay = (corner === 'tl' || corner === 'tr') ? start.y + start.side : start.y;
                let nx, ny;
                if (corner === 'tl') { nx = start.x + dx; ny = start.y + dy; }
                if (corner === 'tr') { nx = start.x + start.side + dx; ny = start.y + dy; }
                if (corner === 'bl') { nx = start.x + dx; ny = start.y + start.side + dy; }
                if (corner === 'br') { nx = start.x + start.side + dx; ny = start.y + start.side + dy; }
                const newSide = Math.max(Math.abs(nx - ax), Math.abs(ny - ay));
                const newX = (corner === 'tl' || corner === 'bl') ? ax - newSide : ax;
                const newY = (corner === 'tl' || corner === 'tr') ? ay - newSide : ay;
                _setCrop({ x: newX, y: newY, side: newSide });
            }

            async function save() {
                const cropData = _toNormalized(crop);
                btnSave.disabled = true; btnCnc.disabled = true;
                status.textContent = 'Speichere …';
                try {
                    const data = await _fetchAlbumForEdit(album);
                    data.meta = data.meta || {};
                    data.meta.thumbnail_crop = cropData;
                    await _saveAlbum(album, data);
                    album.thumbnail_crop = cropData;
                    const cv = card.querySelector('.album-cover');
                    _applyCropToCover(cv, cropData);
                    if (typeof window.mpdToast === 'function') {
                        window.mpdToast('Cover-Ausschnitt gespeichert', { duration: 2200 });
                    }
                    close();
                } catch (err) {
                    status.textContent = `Fehler: ${err.message || err}`;
                    btnSave.disabled = false; btnCnc.disabled = false;
                }
            }
        }

        // ── Album-Aktionen: Popover + Aktionen ───────────────────────────
        let _openPopover = null;

        function _closeAlbumPopover() {
            if (_openPopover) { _openPopover.remove(); _openPopover = null; }
            document.removeEventListener('click',   _onPopoverOutside, true);
            document.removeEventListener('keydown', _onPopoverEsc);
        }
        function _onPopoverOutside(e) {
            if (!_openPopover) return;
            if (_openPopover.contains(e.target)) return;
            // Klick auf den Owner-Kebab nicht schliessen — der toggelt selbst
            if (_openPopover._owner && _openPopover._owner.contains(e.target)) return;
            _closeAlbumPopover();
        }
        function _onPopoverEsc(e) {
            if (e.key === 'Escape') { _closeAlbumPopover(); }
        }

        function _openAlbumActionsPopover(card, album, anchorEl) {
            _closeAlbumPopover();
            const pop = document.createElement('div');
            pop.className = 'alb-popover';
            pop.setAttribute('role', 'menu');

            const mkItem = (icon, label, onClick, opts = {}) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.setAttribute('role', 'menuitem');
                if (opts.destructive) b.classList.add('alb-pop-destructive');
                if (opts.disabled) b.disabled = true;
                if (opts.title) b.title = opts.title;
                const ic = document.createElement('span');
                ic.className = 'alb-pop-icon';
                // icon may be SVG markup (<svg…/>) or plain text/emoji — innerHTML
                // works for both since emojis are valid as text content.
                ic.innerHTML = icon;
                const tx = document.createElement('span');
                tx.textContent = label;
                b.appendChild(ic);
                b.appendChild(tx);
                if (opts.hint) {
                    const h = document.createElement('span');
                    h.className = 'alb-pop-hint';
                    h.textContent = opts.hint;
                    b.appendChild(h);
                }
                if (!opts.disabled && onClick) {
                    b.addEventListener('click', (e) => {
                        e.stopPropagation();
                        _closeAlbumPopover();
                        onClick();
                    });
                }
                return b;
            };
            const divider = () => {
                const d = document.createElement('div');
                d.className = 'alb-pop-divider';
                return d;
            };

            const _kt = (k, fb) => (window.MPD_I18N ? window.MPD_I18N.t(k) : fb) || fb;
            // SVG icons matching the rest of the album-header / lightbox vocab
            // (Lucide outline, currentColor, stroke 2). 18×18 viewBox.
            const _ICO = {
                pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
                image:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>',
                link:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
                trash:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>',
            };
            pop.appendChild(mkItem(_ICO.pencil, _kt('album_kebab.rename', 'Umbenennen…'),     () => _openAlbumRenameModal(album, card)));
            pop.appendChild(mkItem(_ICO.image,  _kt('album_kebab.cover',  'Deckblatt ändern…'), () => _openAlbumCoverPicker(album, card)));
            if (appSettings.share_enabled) {
                pop.appendChild(mkItem(_ICO.link, _kt('album_kebab.share', 'Teilen…'), () => _openAlbumShareModal(album, card)));
            } else {
                pop.appendChild(mkItem(_ICO.link, _kt('album_kebab.share', 'Teilen…'), null, {
                    disabled: true,
                    hint    : _kt('album_kebab.share_disabled_hint', 'deaktiviert'),
                    title   : _kt('album_kebab.share_disabled_title', 'Teilen ist global deaktiviert (Einstellungen → Globale Einstellungen).'),
                }));
            }
            pop.appendChild(divider());
            pop.appendChild(mkItem(_ICO.trash, _kt('album_kebab.delete', 'Album löschen…'),  () => _confirmDeleteAlbum(album), { destructive: true }));

            // Position: unter dem Kebab, rechtsbuendig
            pop._owner = anchorEl;
            document.body.appendChild(pop);
            const ar = anchorEl.getBoundingClientRect();
            const pr = pop.getBoundingClientRect();
            let left = Math.min(window.innerWidth - pr.width - 8, ar.right - pr.width);
            left = Math.max(8, left);
            let top = ar.bottom + 6;
            // Wenn unten kein Platz, nach oben kippen
            if (top + pr.height > window.innerHeight - 8) top = Math.max(8, ar.top - pr.height - 6);
            pop.style.left = left + 'px';
            pop.style.top  = top  + 'px';

            _openPopover = pop;
            // Click-outside / ESC schliesst
            setTimeout(() => {
                document.addEventListener('click',   _onPopoverOutside, true);
                document.addEventListener('keydown', _onPopoverEsc);
            }, 0);
        }

        // ── Umbenennen ───────────────────────────────────────────────────
        function _openAlbumRenameModal(album, card) {
            const _t = (k, vars, fb) => (window.MPD_I18N ? window.MPD_I18N.t(k, vars) : fb) || fb;
            const ov = document.createElement('div');
            ov.className = 'alb-rename-overlay';
            ov.innerHTML = `
                <div class="alb-rename-box">
                    <h3>${_t('album_rename.title', null, 'Album umbenennen')}</h3>
                    <input type="text" id="alb-rename-input" maxlength="200" value="${escapeHtml(album.title || album.name)}">
                    <div class="alb-rename-status" id="alb-rename-status"></div>
                    <div class="alb-rename-actions">
                        <button class="alb-rename-cancel" type="button">${_t('album_rename.btn_cancel', null, 'Abbrechen')}</button>
                        <button class="alb-rename-ok"     type="button">${_t('album_rename.btn_save', null, 'Speichern')}</button>
                    </div>
                </div>`;
            document.body.appendChild(ov);
            const box    = ov.querySelector('.alb-rename-box');
            const input  = ov.querySelector('#alb-rename-input');
            const status = ov.querySelector('#alb-rename-status');
            const btnOk  = ov.querySelector('.alb-rename-ok');
            const btnCnc = ov.querySelector('.alb-rename-cancel');

            const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
            const onKey = (e) => {
                if (e.key === 'Escape') { e.preventDefault(); close(); }
                if (e.key === 'Enter')  { e.preventDefault(); save(); }
            };
            ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
            btnCnc.addEventListener('click', close);
            btnOk.addEventListener('click', save);
            document.addEventListener('keydown', onKey);

            setTimeout(() => { input.focus(); input.select(); }, 30);

            async function save() {
                const newTitle = input.value.trim();
                if (!newTitle) { status.textContent = _t('album_rename.err_empty', null, 'Titel darf nicht leer sein.'); return; }
                if (newTitle === (album.title || '')) { close(); return; }
                btnOk.disabled = true; btnCnc.disabled = true;
                status.textContent = _t('album_rename.status_saving', null, 'Speichere …');
                try {
                    const data = await _fetchAlbumForEdit(album);
                    data.meta = data.meta || {};
                    data.meta.title = newTitle;
                    await _saveAlbum(album, data);
                    album.title = newTitle;
                    const t = card.querySelector('.album-title');
                    if (t) t.textContent = newTitle;
                    if (typeof window.mpdToast === 'function') window.mpdToast(_t('album_rename.toast_renamed', { title: newTitle }, `Umbenannt zu „${newTitle}"`), { duration: 2500 });
                    close();
                } catch (err) {
                    status.textContent = _t('album_rename.error_prefix', { msg: (err.message || err) }, `Fehler: ${err.message || err}`);
                    btnOk.disabled = false; btnCnc.disabled = false;
                }
            }
        }

        // ── Deckblatt ändern ─────────────────────────────────────────────
        async function _openAlbumCoverPicker(album, card) {
            const _t = (k, vars, fb) => (window.MPD_I18N ? window.MPD_I18N.t(k, vars) : fb) || fb;
            const ov = document.createElement('div');
            ov.className = 'alb-coverpick-overlay';
            ov.innerHTML = `
                <div class="alb-coverpick-box">
                    <div class="alb-coverpick-header">
                        <h3>${_t('cover_picker.title', { album: escapeHtml(album.title || album.name) }, `Deckblatt für „${escapeHtml(album.title || album.name)}" wählen`)}</h3>
                        <button type="button" aria-label="${_t('cover_picker.close_aria', null, 'Schließen')}">&times;</button>
                    </div>
                    <div class="alb-coverpick-body" id="alb-coverpick-grid">
                        <div style="grid-column:1/-1;text-align:center;color:var(--muted,#888);padding:2rem">${_t('cover_picker.loading', null, 'Lade Fotos …')}</div>
                    </div>
                    <div class="alb-coverpick-status" id="alb-coverpick-status"></div>
                </div>`;
            document.body.appendChild(ov);
            const box  = ov.querySelector('.alb-coverpick-box');
            const grid = ov.querySelector('#alb-coverpick-grid');
            const stat = ov.querySelector('#alb-coverpick-status');

            const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
            const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(); } };
            ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
            ov.querySelector('.alb-coverpick-header button').addEventListener('click', close);
            document.addEventListener('keydown', onKey);

            let albumData;
            try {
                albumData = await _fetchAlbumForEdit(album);
            } catch (err) {
                grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#e06868;padding:2rem">${escapeHtml(_t('cover_picker.error', { msg: (err.message || String(err)) }, `Fehler: ${err.message || err}`))}</div>`;
                return;
            }
            const photos = (albumData.elements || []).filter(e => e.type === 'photo' && e.file);
            if (photos.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--muted,#888);padding:2rem">${_t('cover_picker.empty', null, 'Keine Fotos im Album.')}</div>`;
                return;
            }
            grid.innerHTML = '';
            const currentThumb = (albumData.meta && albumData.meta.thumbnail) || album.thumbnail;
            photos.forEach(photo => {
                const tile = document.createElement('div');
                tile.className = 'alb-coverpick-tile' + (photo.file === currentThumb ? ' current' : '');
                const thumbUrl = photo.thumbnails?.sm
                    ? `${API_BASE}${photo.thumbnails.sm}`
                    : `${API_BASE}/api/thumbnail/${encodeURIComponent(album.space)}/${encodeURIComponent(album.name)}/${encodeURIComponent(photo.file)}?size=sm`;
                tile.innerHTML = `<img src="${thumbUrl}" loading="lazy" decoding="async" alt="">`;
                tile.addEventListener('click', async () => {
                    if (photo.file === currentThumb) { close(); return; }
                    grid.querySelectorAll('.alb-coverpick-tile').forEach(t => t.classList.remove('current'));
                    tile.classList.add('current');
                    stat.textContent = _t('cover_picker.status_saving', null, 'Speichere …');

                    let newThumbName = photo.file;
                    try {
                        // PDX v1.4: bei verwiesenem Foto Spec-konforme stille Kopie als Cover
                        if (photo.source_album) {
                            const r = await fetch(
                                `${API_BASE}/api/album/${encodeURIComponent(album.space)}/${encodeURIComponent(album.name)}/cover-from-source`,
                                {
                                    method : 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body   : JSON.stringify({ source_album: photo.source_album, file: photo.file }),
                                }
                            );
                            const d = await r.json();
                            if (!r.ok) throw new Error(d.detail || r.statusText);
                            newThumbName = d.thumbnail;
                        }
                        albumData.meta = albumData.meta || {};
                        albumData.meta.thumbnail = newThumbName;
                        // Variante ii: alter Crop ist fotospezifisch — beim Foto-Wechsel verwerfen.
                        if (albumData.meta.thumbnail_crop) delete albumData.meta.thumbnail_crop;
                        await _saveAlbum(album, albumData);
                        album.thumbnail = newThumbName;
                        album.thumbnail_crop = null;
                        // Card-Bild im Grid auffrischen + alten Crop-Render zuruecksetzen
                        const newUrl = `${API_BASE}/api/thumbnail/${encodeURIComponent(album.space)}/${encodeURIComponent(album.name)}/${encodeURIComponent(newThumbName)}?size=sm`;
                        const cv   = card.querySelector('.album-cover');
                        const im   = card.querySelector('.album-cover-img');
                        const blur = card.querySelector('.album-cover-blur');
                        _clearCropFromCover(cv);
                        if (im)   im.src = newUrl + '&_t=' + Date.now();   // cache-bust
                        if (blur) blur.style.backgroundImage = `url('${newUrl}&_t=${Date.now()}')`;
                        if (typeof window.mpdToast === 'function') window.mpdToast(_t('cover_picker.toast_changed', null, 'Deckblatt geändert'), { duration: 2200 });
                        close();
                    } catch (err) {
                        stat.textContent = _t('cover_picker.error_prefix', { msg: (err.message || err) }, `Fehler: ${err.message || err}`);
                    }
                });
                grid.appendChild(tile);
            });
        }

                                        ? (window.MPD_I18N ? window.MPD_I18N.t('settings_modal.smtp_pass_hint_set', { hint: appSettings.smtp_pass_hint }) : `Gesetzt: ${appSettings.smtp_pass_hint}`)

                                    value="${appSettings.smtp_from_addr || ''}" autocomplete="off">

                                <div class="alb-settings-row-label">

                                    value="${appSettings.smtp_from_name || ''}" placeholder="My Photo Diary" autocomplete="off">
                            </div>
                            <div class="alb-settings-row">
                                <div class="alb-settings-row-label">
                                    <div class="alb-settings-row-name">${_t('settings_modal.smtp_test_name', 'Verbindung prüfen')}</div>

                                <input type="email" class="alb-settings-companion-input" id="smtp-test-addr-input"
                                    value="${appSettings.smtp_from_addr || ''}" placeholder="empfaenger@example.org" autocomplete="off">
                            </div>
                            <div class="alb-settings-row" style="justify-content:flex-end;gap:.5rem;">

                        <div class="alb-settings-status" id="alb-settings-status"></div>
                    </div>
                </div>`;
            document.body.appendChild(ov);

            const status   = ov.querySelector('#alb-settings-status');
            const btnClose = ov.querySelector('.alb-settings-close');

            const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
            const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(); } };
            ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
            btnClose.addEventListener('click', close);
            document.addEventListener('keydown', onKey);

            // Adressbuch öffnen
            ov.querySelector('#settings-open-contacts').addEventListener('click', () => {
                _openContactsModal();
            });

            // Admin-Switches: auf Änderung direkt speichern
            if (isAdmin) {
                ov.querySelectorAll('.alb-settings-switch').forEach(cb => {
                    cb.addEventListener('change', async () => {
                        const key = cb.dataset.key;
                        const val = cb.checked;
                        const prev = appSettings[key];
                        cb.disabled = true;
                        status.textContent = _t('settings_modal.status_saving', 'Speichere…');
                        try {
                            const r = await fetch(`${API_BASE}/api/settings`, {
                                method : 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body   : JSON.stringify({ [key]: val }),
                            });
                            const d = await r.json();
                            if (!r.ok) throw new Error(d.detail || r.statusText);
                            appSettings = { ...appSettings, ...d };
                            status.textContent = '';
                            if (typeof window.mpdToast === 'function') {
                                window.mpdToast(val
                                    ? _t('settings_modal.toast_enabled', 'Einstellung aktiviert')
                                    : _t('settings_modal.toast_disabled', 'Einstellung deaktiviert'),
                                    { duration: 1500 });
                            }
                            // Falls share_enabled kippt, Album-Liste neu zeichnen → Kebab-Tooltip
                            if (key === 'share_enabled') renderAlbums();
                        } catch (err) {
                            cb.checked = prev;  // zurück
                            const _msg = (window.MPD_I18N ? window.MPD_I18N.t('settings_modal.error_prefix', { msg: (err.message || err) }) : `Fehler: ${err.message || err}`);
                            status.textContent = _msg;
                        } finally {
                            cb.disabled = false;
                        }
                    });
                });

                // Companion-Speichern
                const companionSaveBtn = ov.querySelector('#companion-save-btn');
                if (companionSaveBtn) {
                    companionSaveBtn.addEventListener('click', async () => {
                        const providerSel = ov.querySelector('#companion-provider-select');
                        const keyInput    = ov.querySelector('#companion-api-key-input');
                        const newProvider = providerSel.value;
                        const newKey      = keyInput.value.trim();
                        const payload     = { companion_provider: newProvider };
                        if (newKey) payload.companion_api_key = newKey;

                        companionSaveBtn.disabled = true;
                        status.textContent = _t('settings_modal.status_saving', 'Speichere…');
                        try {
                            const r = await fetch(`${API_BASE}/api/settings`, {
                                method : 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body   : JSON.stringify(payload),
                            });
                            let d;
                            try { d = await r.json(); } catch { throw new Error(`HTTP ${r.status}`); }
                            if (!r.ok) throw new Error(d.detail || r.statusText);
                            appSettings = { ...appSettings, ...d };
                            keyInput.value = '';
                            status.textContent = '';
                            const hintEl = ov.querySelector('#companion-key-hint');
                            if (hintEl) {
                                const newHint = d.companion_api_key_hint;
                                hintEl.textContent = newHint
                                    ? (window.MPD_I18N ? window.MPD_I18N.t('settings_modal.companion_key_hint_set', { hint: newHint }) : `Gesetzt: ${newHint}`)
                                    : _t('settings_modal.companion_key_hint_empty', 'Noch kein Key hinterlegt.');
                            }
                            if (typeof window.mpdToast === 'function') {
                                window.mpdToast(_t('settings_modal.companion_saved', 'Companion gespeichert'), { duration: 1800 });
                            }
                            if (window.Companion) { window.Companion.reset?.(); window.Companion.init?.(); }
                        } catch (err) {
                            const _msg = (window.MPD_I18N ? window.MPD_I18N.t('settings_modal.error_prefix', { msg: (err.message || err) }) : `Fehler: ${err.message || err}`);
                            status.textContent = _msg;
                        } finally {
                            companionSaveBtn.disabled = false;
                        }
                    });
                }

                // ── Mailversand (Admin) ─────────────────────────────────
                // Einstellungen gewinnen, mpd.env bleibt der Rueckfall. Das
                // Passwort geht nur maskiert heraus; ein leeres Feld wird
                // deshalb NICHT mitgeschickt, sonst hiesse Speichern
                // versehentlich Loeschen (das Backend faengt es zusaetzlich ab).
                const smtpSaveBtn = ov.querySelector('#smtp-save-btn');
                const smtpTestBtn = ov.querySelector('#smtp-test-btn');

                // MPD Plus — Lizenzstand anzeigen, Text einspielen, entfernen.
                const plusHint = ov.querySelector('#plus-state-hint');
                const _renderPlus = (lic) => {
                    if (!plusHint) return;
                    lic = lic || {};
                    let txt;
                    // Karenz (24.09.2026): `valid` bleibt waehrend der Karenz true —
                    // ohne den Zweig stuende hier "gueltig bis" mit einem Datum in der
                    // Vergangenheit. Und wer in zwei Wochen ablaeuft, soll es hier sehen
                    // und nicht erst am Stichtag vor einem Schloss stehen.
                    const rest = (lic.grace_days || 0) + (lic.days_left || 0);
                    if (lic.in_grace) {
                        txt = _t('settings_modal.plus_state_grace', { date: lic.expires || '', days: rest },
                                 `Abgelaufen am ${lic.expires || ''} — die Module laufen noch ${rest} Tage, dann sind sie gesperrt.`);
                    } else if (lic.valid) {
                        txt = _t('settings_modal.plus_state_valid', { customer: lic.customer || '—', modules: (lic.modules || []).join(', ') || '—' },
                                 `Gültig für ${lic.customer || '—'} · Module: ${(lic.modules || []).join(', ') || '—'}`);
                        if (lic.expires) {
                            txt += ' · ' + (typeof lic.days_left === 'number' && lic.days_left <= 14
                                ? _t('settings_modal.plus_expires_soon', { days: lic.days_left, date: lic.expires },
                                     `läuft in ${lic.days_left} Tagen ab (${lic.expires})`)
                                : _t('settings_modal.plus_expires', { date: lic.expires }, `gültig bis ${lic.expires}`));
                        }
                    } else if (lic.error === 'abgelaufen') {
                        txt = _t('settings_modal.plus_state_expired', { date: lic.expires || '' }, `Abgelaufen am ${lic.expires || ''} — Plus ist aus, Basis läuft.`);
                    } else if (lic.error && lic.error !== 'keine Lizenzdatei') {
                        txt = _t('settings_modal.plus_state_broken', { msg: lic.error }, `Lizenzdatei unbrauchbar: ${lic.error}`);
                    } else {
                        txt = _t('settings_modal.plus_state_none', null, 'Keine Lizenz eingespielt.');
                    }
                    if (!lic.enforced) txt += ' ' + _t('settings_modal.plus_not_enforced', null, '(Auf dieser Installation ist die Lizenzprüfung aus — alle Module sind frei.)');
                    plusHint.textContent = txt;
                    const rm = ov.querySelector('#plus-remove-btn');
                    if (rm) rm.style.display = (lic.valid || lic.in_grace || lic.error === 'abgelaufen' || (lic.error && lic.error !== 'keine Lizenzdatei')) ? '' : 'none';
                };
                _renderPlus(appSettings.license);
                /* ── Standortverlauf mitnehmen ──
                   Bewusst hier und nicht in der Werkzeugleiste der Trails-Seite:
                   Das ist eine Handlung fuer einmal im Jahr, nicht fuer jeden Tag,
                   und sie holt zwoelf Jahre Bewegungsgeschichte auf einmal. Neben
                   dem taeglichen GPX-Knopf waere sie zu leicht zu treffen — auch
                   fuer jemanden, der eine offene Sitzung vor sich hat. */
                const trailsBtn  = ov.querySelector('#trails-export-btn');
                const trailsHint = ov.querySelector('#trails-export-hint');
                if (trailsBtn) trailsBtn.addEventListener('click', async () => {
                    const _mb = b => b >= 1e9 ? (b / 1e9).toFixed(1).replace('.', ',') + ' GB'
                                              : Math.round(b / 1e6) + ' MB';
                    trailsBtn.disabled = true;
                    try {
                        const r = await fetch(`${API_BASE}/api/trails/archive`,
                                              { credentials: 'same-origin' });
                        if (!r.ok) throw new Error(`HTTP ${r.status}`);
                        const info = await r.json();
                        const dateien = info.files || [];
                        if (!dateien.length) {
                            trailsHint.textContent = _t('settings_modal.trails_export_empty', null,
                                'Noch nichts im Archiv — die Monatsdateien entstehen nachts.');
                            return;
                        }
                        const monate = dateien.filter(f => f.month).map(f => f.month).sort();
                        const spanne = monate.length
                            ? `${monate[0]} – ${monate[monate.length - 1]}` : '';
                        const ok = await window.mpdConfirm({
                            icon: '📍',
                            title: _t('settings_modal.trails_export_name', '📍 Standortverlauf mitnehmen'),
                            subtitle: `${dateien.length} Dateien, ${_mb(info.bytes || 0)}${spanne ? ' — ' + spanne : ''}`,
                            body: _t('settings_modal.trails_export_body', null,
                                'Du bekommst deinen vollständigen Verlauf als ZIP: je Monat eine Datei '
                                + 'mit einer Zeile je aufgezeichnetem Punkt, dazu die erkannten '
                                + 'Aufenthalte, Wege und Orte. Reiner Text, lesbar auch ohne '
                                + 'My Photo Diary.'),
                            hint: _t('settings_modal.trails_export_warn', null,
                                'Die Datei enthält, wo du in den letzten Jahren warst. Leg sie nur '
                                + 'dorthin, wo du sie haben willst.'),
                            hintType: 'warn',
                            confirmLabel: _t('settings_modal.trails_export_btn', 'Herunterladen'),
                        });
                        if (ok) window.location.href = `${API_BASE}/api/trails/archive.zip`;
                    } catch (e) {
                        trailsHint.textContent = _t('settings_modal.trails_export_error',
                            { msg: String(e && e.message || e) },
                            `Archiv nicht abrufbar: ${e && e.message || e}`);
                    } finally {
                        trailsBtn.disabled = false;
                    }
                });

                // Rueckmeldung direkt unter den Knoepfen — die Statuszeile am Dialogende
                // lag beim Klick ausser Sicht (24.09.2026: "nichts passiert").
                const plusStatus = ov.querySelector('#plus-status') || status;
                const plusInstall = ov.querySelector('#plus-install-btn');
                if (plusInstall) plusInstall.addEventListener('click', async () => {
                    const ta = ov.querySelector('#plus-license-text');
                    const text = (ta?.value || '').trim();
                    if (!text) { plusStatus.textContent = _t('settings_modal.plus_paste_empty', null, 'Bitte den Lizenztext einfügen.'); return; }
                    plusInstall.disabled = true;
                    plusStatus.textContent = _t('settings_modal.status_saving', 'Speichere…');
                    try {
                        const r = await fetch(`${API_BASE}/api/settings/license`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text }), credentials: 'same-origin',
                        });
                        const d = await r.json().catch(() => ({}));
                        if (!r.ok) throw new Error(d.detail || r.status);
                        appSettings.license = d; _renderPlus(d);
                        if (ta) ta.value = '';
                        plusStatus.textContent = _t('settings_modal.plus_installed', 'Lizenz eingespielt') + ' ✓';
                        if (window.mpdToast) window.mpdToast(_t('settings_modal.plus_installed', null, 'Lizenz eingespielt'), { duration: 2200 });
                    } catch (err) {
                        plusStatus.textContent = String(err.message || err);
                    } finally { plusInstall.disabled = false; }
                });
                const plusRemove = ov.querySelector('#plus-remove-btn');
                if (plusRemove) plusRemove.addEventListener('click', async () => {
                    const ok = await window.mpdConfirm({
                        icon: '🔒', title: _t('settings_modal.plus_remove_title', null, 'Lizenz entfernen?'),
                        body: _t('settings_modal.plus_remove_body', null, 'Plus fällt damit weg, Basis läuft weiter. Die Datei kann jederzeit wieder eingespielt werden.'),
                        confirmLabel: _t('settings_modal.plus_remove', null, 'Lizenz entfernen'), destructive: true,
                    });
                    if (!ok) return;
                    try {
                        const r = await fetch(`${API_BASE}/api/settings/license`, { method: 'DELETE', credentials: 'same-origin' });
                        const d = await r.json().catch(() => ({}));
                        if (!r.ok) throw new Error(d.detail || r.status);
                        appSettings.license = d; _renderPlus(d);
                    } catch (err) { plusStatus.textContent = String(err.message || err); }
                });

                if (smtpSaveBtn) {
                    smtpSaveBtn.addEventListener('click', async () => {
                        const val = id => (ov.querySelector(id)?.value || '').trim();
                        const pass = val('#smtp-pass-input');
                        const payload = {
                            smtp_host     : val('#smtp-host-input'),
                            smtp_port     : parseInt(val('#smtp-port-input'), 10) || 0,
                            smtp_user     : val('#smtp-user-input'),
                            smtp_from_addr: val('#smtp-from-addr-input'),
                            smtp_from_name: val('#smtp-from-name-input'),

                        if (pass) payload.smtp_pass = pass;

                        smtpSaveBtn.disabled = true;
                        status.textContent = _t('settings_modal.status_saving', 'Speichere…');
                        try {
                            const r = await fetch(`${API_BASE}/api/settings`, {
                                method : 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body   : JSON.stringify(payload),
                                credentials: 'same-origin',
                            });
                            if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
                            const d = await r.json();
                            appSettings = { ...appSettings, ...d };
                            status.textContent = '';

                            const passInput = ov.querySelector('#smtp-pass-input');
                            if (passInput) passInput.value = '';
                            const passHint = ov.querySelector('#smtp-pass-hint');
                            if (passHint) {
                                passHint.textContent = d.smtp_pass_hint
                                    ? (window.MPD_I18N ? window.MPD_I18N.t('settings_modal.smtp_pass_hint_set', { hint: d.smtp_pass_hint }) : `Gesetzt: ${d.smtp_pass_hint}`)
                                    : _t('settings_modal.smtp_pass_hint_empty', 'Leer lassen heißt: unverändert.');
                            }
                            const stateHint = ov.querySelector('#smtp-state-hint');
                            if (stateHint) {
                                stateHint.textContent = d.smtp_configured
                                    ? (d.smtp_source === 'settings'
                                        ? _t('settings_modal.smtp_state_settings', 'Eingerichtet über diese Seite.')
                                        : _t('settings_modal.smtp_state_env', 'Eingerichtet über mpd.env. Trägst du hier etwas ein, gilt das stattdessen.'))
                                    : _t('settings_modal.smtp_state_none', 'Nicht eingerichtet — Teilen per Mail und Einladungen sind aus.');
                            }
                            if (typeof window.mpdToast === 'function') {
                                window.mpdToast(_t('settings_modal.smtp_saved', 'Mailversand gespeichert'), { duration: 1800 });
                            }
                        } catch (err) {
                            status.textContent = (window.MPD_I18N ? window.MPD_I18N.t('settings_modal.error_prefix', { msg: (err.message || err) }) : `Fehler: ${err.message || err}`);
                        } finally {
                            smtpSaveBtn.disabled = false;
                        }
                    });
                }

                if (smtpTestBtn) {
                    smtpTestBtn.addEventListener('click', async () => {
                        const to = (ov.querySelector('#smtp-test-addr-input')?.value || '').trim();
                        if (!to) {
                            status.textContent = _t('settings_modal.smtp_test_no_addr', 'Bitte eine Empfängeradresse eintragen.');
                            return;
                        }
                        smtpTestBtn.disabled = true;
                        status.textContent = _t('settings_modal.smtp_test_sending', 'Sende Testmail…');
                        try {
                            const r = await fetch(`${API_BASE}/api/mail-test`, {
                                method : 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body   : JSON.stringify({ to_email: to }),
                                credentials: 'same-origin',
                            });
                            if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
                            status.textContent = '';
                            if (typeof window.mpdToast === 'function') {

            document.body.appendChild(ov);

            const btnClose = ov.querySelector('.alb-settings-close');
