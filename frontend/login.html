<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2C3E50">
<title>My Photo Diary — Login</title>
<script src="/js/i18n.js?v=48"></script>
<script src="/js/version-watch.js?v=5"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { overscroll-behavior: none; }

body {
    font-family: Archivo, 'Helvetica Neue', Arial, sans-serif;
    background: #2C3E50;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-box {
    background: #1a2530;
    border-radius: 12px;
    padding: 40px 36px 32px;
    width: 340px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.login-box h1 {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    text-align: center;
    margin-bottom: 4px;
}

.login-box .tagline {
    font-size: 12px;
    color: #c8922a;
    text-align: center;
    margin-bottom: 28px;
    font-style: italic;
}

.login-box label {
    display: block;
    font-size: 13px;
    color: #aaa;
    margin-bottom: 5px;
}

.login-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #3a4a5a;
    border-radius: 6px;
    background: #253040;
    color: #e0e0e0;
    font-size: 15px;
    outline: none;
    margin-bottom: 16px;
}

.login-box input:focus {
    border-color: #2E75B6;
}

.login-box button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 6px;
    background: #2E75B6;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
}

.login-box button:hover {
    background: #245f96;
}

.login-box button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.error {
    color: #e74c3c;
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
    min-height: 18px;
}

.demo-hint {
    margin-top: 18px;
    padding: 10px 12px;
    border: 1px dashed #3a4a5a;
    border-radius: 6px;
    background: #253040;
    font-size: 12px;
    color: #aaa;
    text-align: center;
    cursor: pointer;
    line-height: 1.5;
}

.demo-hint:hover {
    border-color: #2E75B6;
    color: #e0e0e0;
}

.demo-hint b {
    color: #c8922a;
    font-weight: 600;
}

.lang-toggle {
    margin-top: 14px;
    text-align: center;
    font-size: 12px;
    color: #6b7a8a;
    cursor: pointer;
    user-select: none;
}
.lang-toggle:hover { color: #aaa; }
</style>
    <link rel="stylesheet" href="/css/fonts.css">
</head>
<body>

<div class="login-box">
    <h1>My Photo Diary</h1>
    <div class="tagline">where your memories stay yours.</div>

    <label for="user" data-i18n="login.label_user">Benutzer</label>
    <input type="text" id="user" autocomplete="username" autofocus>

    <label for="pass" data-i18n="login.label_pass">Passwort</label>
    <input type="password" id="pass" autocomplete="current-password">

    <button id="btn" onclick="doLogin()" data-i18n="login.btn_signin">Anmelden</button>
    <div class="error" id="error"></div>

    <div class="demo-hint" onclick="fillDemo()" data-i18n-attr="title:login.demo_hint_title" title="Klicken zum Übernehmen">
        <span data-i18n="login.demo_hint_prefix">Demo-Login:</span> <b>mpd-demo</b> · <b>mpd-demo</b>
    </div>

    <div class="lang-toggle" id="lang-toggle" onclick="window.MPD_I18N && window.MPD_I18N.setLang(window.MPD_I18N.getLang()==='de'?'en':'de');" data-i18n="login.lang_toggle">English</div>
</div>

<script>
document.getElementById('pass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
});

function fillDemo() {
    document.getElementById('user').value = 'mpd-demo';
    document.getElementById('pass').value = 'mpd-demo';
    document.getElementById('pass').focus();
}

async function doLogin() {
    var btn = document.getElementById('btn');
    var err = document.getElementById('error');
    var user = document.getElementById('user').value.trim();
    var pass = document.getElementById('pass').value;
    var tr = (k, fb) => (window.MPD_I18N ? window.MPD_I18N.t(k) : fb) || fb;

    err.textContent = '';
    if (!user || !pass) { err.textContent = tr('login.err_empty_fields', 'Bitte beide Felder ausfüllen.'); return; }

    btn.disabled = true;
    btn.textContent = '…';

    try {
        var resp = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass })
        });
        var data = await resp.json();

        if (!resp.ok) {
            err.textContent = data.detail || tr('login.err_failed', 'Login fehlgeschlagen');
            return;
        }

        window.location.href = '/';
    } catch (e) {
        err.textContent = tr('login.err_connection', 'Verbindungsfehler');
    } finally {
        btn.disabled = false;
        btn.textContent = tr('login.btn_signin', 'Anmelden');
    }
}
</script>

</body>
</html>
