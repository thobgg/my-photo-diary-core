<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2C3E50">
<title>My Photo Diary — Passwort ändern</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { overscroll-behavior: none; }
body {
    font-family: Archivo, 'Helvetica Neue', Arial, sans-serif;
    background: #2C3E50;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.pw-box {
    background: #1a2530;
    border-radius: 12px;
    padding: 40px 36px 32px;
    width: 360px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.pw-box h1 {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    text-align: center;
    margin-bottom: 4px;
}
.pw-box .hint {
    font-size: 12.5px;
    color: #aaa;
    text-align: center;
    margin-bottom: 24px;
    line-height: 1.5;
}
.pw-box label {
    display: block;
    font-size: 13px;
    color: #aaa;
    margin-bottom: 5px;
}
.pw-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #3a4a5a;
    border-radius: 6px;
    background: #253040;
    color: #e0e0e0;
    font-size: 15px;
    outline: none;
    margin-bottom: 16px;
}
.pw-box input:focus { border-color: #2E75B6; }
.pw-box button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 6px;
    background: #2E75B6;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}
.pw-box button:hover:not(:disabled) { background: #4F81BD; }
.pw-box button:disabled { opacity: 0.5; cursor: not-allowed; }
.pw-status {
    min-height: 1.3em;
    font-size: 13px;
    color: #e06868;
    text-align: center;
    margin-top: 14px;
}
.pw-status.ok { color: #6fbf73; }
</style>
    <link rel="stylesheet" href="/css/fonts.css">
</head>
<body>
<div class="pw-box">
    <h1 data-de="Neues Passwort setzen" data-en="Set a new password">Neues Passwort setzen</h1>
    <div class="hint" data-de="Dein Zugang wurde mit einem Startpasswort angelegt. Bitte wähle jetzt ein eigenes (mindestens 12 Zeichen)."
         data-en="Your account was created with a starter password. Please choose your own now (at least 12 characters).">
        Dein Zugang wurde mit einem Startpasswort angelegt.
        Bitte wähle jetzt ein eigenes (mindestens 12 Zeichen).
    </div>
    <form id="pw-form" autocomplete="off">
        <label for="pw-old" data-de="Bisheriges Passwort" data-en="Current password">Bisheriges Passwort</label>
        <input type="password" id="pw-old" autocomplete="current-password" required>
        <label for="pw-new" data-de="Neues Passwort" data-en="New password">Neues Passwort</label>
        <input type="password" id="pw-new" autocomplete="new-password" minlength="12" required>
        <label for="pw-new2" data-de="Neues Passwort wiederholen" data-en="Repeat new password">Neues Passwort wiederholen</label>
        <input type="password" id="pw-new2" autocomplete="new-password" minlength="12" required>
        <button type="submit" id="pw-submit" data-de="Passwort ändern" data-en="Change password">Passwort ändern</button>
    </form>
    <div class="pw-status" id="pw-status"></div>
</div>
<script>
(function () {
    'use strict';
    var lang = (navigator.language || 'de').slice(0, 2) === 'en' ? 'en' : 'de';
    if (lang === 'en') {
        document.documentElement.lang = 'en';
        document.title = 'My Photo Diary — Change password';
        document.querySelectorAll('[data-en]').forEach(function (el) {
            el.textContent = el.getAttribute('data-en');
        });
    }
    var T = {
        de: { mismatch: 'Die neuen Passwörter stimmen nicht überein.',
              sending: 'Speichere…',
              done: 'Passwort geändert — weiter geht’s…' },
        en: { mismatch: 'The new passwords do not match.',
              sending: 'Saving…',
              done: 'Password changed — continuing…' }
    }[lang];

    var form = document.getElementById('pw-form');
    var status = document.getElementById('pw-status');
    var btn = document.getElementById('pw-submit');

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var oldPw = document.getElementById('pw-old').value;
        var newPw = document.getElementById('pw-new').value;
        var newPw2 = document.getElementById('pw-new2').value;
        status.className = 'pw-status';
        if (newPw !== newPw2) { status.textContent = T.mismatch; return; }

        btn.disabled = true;
        status.textContent = T.sending;
        fetch('/api/account/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ old_password: oldPw, new_password: newPw })
        }).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (d) {
                if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
                status.className = 'pw-status ok';
                status.textContent = T.done;
                setTimeout(function () { window.location.href = '/'; }, 900);
            });
        }).catch(function (err) {
            status.textContent = err.message || String(err);
            btn.disabled = false;
        });
    });
})();
</script>
</body>
</html>
