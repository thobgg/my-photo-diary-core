<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>Geteilt · My Photo Diary</title>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="My Photo Diary">
    <meta property="og:title" content="{{OG_TITLE}}">
    <meta property="og:description" content="{{OG_DESCRIPTION}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta property="og:url" content="{{OG_URL}}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/style.css?v=8">
    <link rel="stylesheet" href="/css/lightbox.css?v=5">
    <link rel="stylesheet" href="/css/edit-text.css">
    <link rel="stylesheet" href="/css/edit-media.css?v=9">
    <script>document.documentElement.setAttribute("data-theme","dark")</script>
    <script src="/js/i18n.js?v=48"></script>
    <script src="/js/version-watch.js?v=5"></script>
    <style>
        /* Share-Viewer-Overrides: aus der Owner-Seite einen Empfänger-
           tauglichen Auftritt machen. */

        /* Versions-Badge (kommt von theme.js) hier nicht zeigen —
           Build-Metadata ist für Empfänger irrelevant. */
        #mpd-version-badge { display: none !important; }

        /* Info-Sidebar in der Lightbox ist im Share leer (kein EXIF-Fetch).
           Hart ausblenden, damit Swipe-Up auf Touch nicht ins Nichts führt. */
        #lb-sidebar { display: none !important; }
        #lb-swipe-hint { display: none !important; }

        /* Schlanker Hero — Logo als Eyecatcher inline neben dem Titel.
           Eine Zeile, zentriert, kein Jahr (redundant zum Titel). */
        .share-hero {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: clamp(.45rem, 1.4vw, .7rem);
            text-align: center;
            padding: clamp(.55rem, 1.4vw, 1rem) 1rem clamp(.45rem, 1.2vw, .85rem);
        }
        .share-hero .share-logo {
            width: clamp(24px, 4vw, 36px);
            height: auto;
            flex-shrink: 0;
            opacity: 0.9;
        }
        .share-hero h1 {
            margin: 0;
            font-family: var(--font-text);
            font-weight: 500;
            font-size: clamp(1.25rem, 3.8vw, 2rem);
            line-height: 1.2;
            letter-spacing: -0.01em;
            color: var(--text, #e0e0e0);
        }

        /* Footer-Klammer: Empfänger-Nachsatz über der Absender-Signatur.
           Klein, kursiv, in Georgia — passt zum Hero-Tonfall. */
        .share-footer-claim {
            font-family: var(--font-text);
            font-style: italic;
            font-size: .88rem;
            color: var(--muted, #888);
            opacity: 0.85;
            margin: 0 0 .3rem;
        }
    </style>
</head>
<body>
    <header class="share-hero">
        <!-- Die Marke kommt aus der einen Quelle, nicht als Kopie im Markup
             (13.09.2026). /img/brand/ ist oeffentlich, Gaeste ohne Konto
             sehen das Bild also auch. -->
        <img class="share-logo" src="/img/brand/mpd-logo.svg" alt="" aria-hidden="true">
        <h1 id="album-title" data-i18n="share_viewer.title_loading">Album wird geladen…</h1>
    </header>

    <div class="container">
        <div id="content"><div class="loading" data-i18n="share_viewer.loading_content">Lade Album…</div></div>
        <footer class="album-footer">
            <p class="share-footer-claim" data-i18n="share_viewer.footer_claim">where memories stay yours — and kindly shared.</p>
            <p id="share-footer-text" data-i18n="share_viewer.footer_text">Geteilt aus My Photo Diary.</p>
        </footer>
    </div>

    <div class="lightbox" id="lightbox">
        <div class="lb-container">
            <div class="lb-main">
                <button class="lb-close" onclick="closeLightbox()" aria-label="Schließen">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
                <button class="lb-nav lb-prev" onclick="navigate(-1)" aria-label="Vorheriges">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </button>
                <button class="lb-nav lb-next" onclick="navigate(1)" aria-label="Nächstes">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </button>
                <div class="lb-image-wrapper" id="lb-image-wrapper" onclick="toggleZoom()">
                    <img id="lb-img" src="" alt="">
                    <video id="lb-video" controls preload="none" style="display:none;max-width:100%;max-height:90vh;"></video>
                </div>
                <div class="lb-bottom-controls">
                    <div class="lb-counter" id="lb-counter"></div>
                    <button class="lb-btn" id="slideshow-btn" onclick="toggleSlideshow()">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <polygon points="6 4 20 12 6 20 6 4"/>
                        </svg>
                        <span data-i18n="lightbox.slideshow">Slideshow</span>
                    </button>
                    <button class="lb-btn" onclick="downloadImage()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        <span data-i18n="lightbox.download">Download</span>
                    </button>
                </div>
            </div>
            <div class="lb-sidebar" id="lb-sidebar">
                <h3 data-i18n="lightbox.sidebar_title">Bildinformationen</h3>
                <div id="lb-metadata"></div>
            </div>
        </div>
    </div>

    <script src="/js/theme.js?v=3"></script>
    <script src="/js/blurhash.js"></script>
    <script src="/js/lightbox-core.js?v=8"></script>
    <script src="/js/album-state.js"></script>
    <script src="/js/album-render.js?v=35"></script>
    <script src="/js/share.js"></script>
</body>
</html>
